<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills 4Life Coaching Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:'#3B62FF',royal:'#2F54EB',slate4:'#707070'},fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']}}}}</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>body{background:#F4F6FB;color:#1f2433}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #3B62FF;outline-offset:2px}@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}.pop{animation:pop .35s ease-out}@media (prefers-reduced-motion:reduce){.pop{animation:none}}</style>
</head>
<body class="font-sans">
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect}=React;
const L=window.lucideReact||window.LucideReact||{};
const I=(n)=>L[n]||(()=>null);
const [CheckCircle2,Circle,Plus,Target,CalendarDays,ListChecks,Users,GraduationCap,ClipboardList,Download,Eye,EyeOff,Trophy,Send,Sparkles,Clock,LogOut,AlertCircle,ChevronLeft,ChevronRight,PartyPopper]=
 ['CheckCircle2','Circle','Plus','Target','CalendarDays','ListChecks','Users','GraduationCap','ClipboardList','Download','Eye','EyeOff','Trophy','Send','Sparkles','Clock','LogOut','AlertCircle','ChevronLeft','ChevronRight','PartyPopper'].map(I);

/* Mock user directory: stands in for a database lookup by email. */
const USER_DIRECTORY={
 'student@skills4life.com':{role:'student',name:'Student'},
 'parent@skills4life.com':{role:'parent',name:'Parent'},
 'coach@skills4life.com':{role:'coach',name:'Coach'}
};
const lookupUser=(email)=>USER_DIRECTORY[email.trim().toLowerCase()]||null;

const Logo=({size=48})=>(
<svg width={size} height={size} viewBox="0 0 64 64" role="img" aria-label="Skills 4Life Coaching logo">
 <circle cx="32" cy="32" r="30.5" fill="#fff" stroke="#707070" strokeWidth="1.6"/>
 <circle cx="32" cy="32" r="26.5" fill="none" stroke="#3B62FF" strokeWidth="1.2"/>
 <g stroke="#3B62FF" strokeWidth="1.8" strokeLinecap="round">
  <line x1="32" y1="8" x2="32" y2="12"/><line x1="19" y1="12" x2="21.5" y2="15.5"/><line x1="45" y1="12" x2="42.5" y2="15.5"/>
  <line x1="12" y1="22" x2="16" y2="23.5"/><line x1="52" y1="22" x2="48" y2="23.5"/>
 </g>
 <path d="M32 17c-3-3-9-2.5-11 1.5-3 .5-5 3.5-4 6.5-1.5 3 .5 6.500 3.500 7 .5 2 2.500 3.500 4.500 3.500h14c2 0 4-1.500 4.500-3.500 3-.5 5-4 3.500-7 1-3-1-6-4-6.500-2-4-8-4.500-11-1.500z" fill="#707070"/>
 <path d="M26 22c2 1 3 3 2 5m8-5c-2 1-3 3-2 5m-7 4c2 0 3 1 4 2m6-2c-2 0-3 1-4 2" stroke="#fff" strokeWidth="1.2" fill="none" strokeLinecap="round"/>
 <path d="M26 35h12v4c0 2-2 3-3 4v1.500h-6V43c-1-1-3-2-3-4z" fill="#707070"/>
 <rect x="27.500" y="46" width="9" height="2" rx="1" fill="#3B62FF"/><rect x="29" y="49.500" width="6" height="1.800" rx=".9" fill="#3B62FF"/>
</svg>);

const Card=({title,icon:Ic,children,action})=>(
<section className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
 <div className="flex items-center justify-between mb-4"><h3 className="flex items-center gap-2 font-bold text-slate-800">{Ic&&<Ic size={18} className="text-brand"/>}{title}</h3>{action}</div>
 {children}
</section>);

/* Dates are stored as ISO strings (YYYY-MM-DD) so the calendar can match them exactly. */
const pad=(n)=>String(n).padStart(2,'0');
const iso=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const parseISO=(s)=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayISO=()=>{const d=new Date();return iso(d.getFullYear(),d.getMonth(),d.getDate())};
const fmtShort=(s)=>parseISO(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});

const initTasks=[{id:1,t:'Finish science lab write-up',due:'2026-11-05',done:false},{id:2,t:'Pack backpack the night before',due:'',daily:true,doneOn:todayISO()},{id:3,t:'Break history project into 3 steps',due:'2026-11-03',done:false},{id:4,t:'10-minute reading with notes',due:'',daily:true,doneOn:''}];
const initGoals=[{id:1,g:'Start homework within 15 minutes of arriving home',p:60,due:''},{id:2,g:'Use planner for every assignment',p:80,due:'2026-11-07'},{id:3,g:'Ask for help before a deadline stress spike',p:35,due:''}];
const planner=[['Mon','Math practice set','4:00'],['Tue','Science lab write-up','4:30'],['Wed','Reading + notes','4:00'],['Thu','History project step 2','4:30'],['Fri','Weekly planner reset','3:45']];

/* Fixed calendar items (sessions, logs, reminders). Student-logged tasks and goals are merged in live. */
const baseEvents=Object.fromEntries(Object.entries({
 3:[{k:'session',t:'Coaching session',n:'4:00 pm. Review the weekly planner and the homework-start timer.'}],
 7:[{k:'task',t:'Weekly planner reset',n:'15 minutes: clear last week, add next week.'}],
 10:[{k:'session',t:'Coaching session',n:'4:00 pm. Check progress on the history project.'}],
 12:[{k:'task',t:'History project step 2',n:'Draft the outline.'}],
 17:[{k:'session',t:'Coaching session',n:'4:00 pm. Goal review.'}],
 19:[{k:'task',t:'Quiz',n:'Study for 10 minutes each night this week.'}],
 24:[{k:'session',t:'Coaching session',n:'4:00 pm. Plan the project wrap-up.'}],
 26:[{k:'task',t:'History project due',n:'Final check: all three steps done.'}]
}).map(([d,v])=>[iso(2026,10,+d),v]));
const initSessions=[
 {id:4,date:'2026-11-02',wins:'Started homework on time 3 days in a row.\nUsed the planner without a reminder.',focus:'Breaking the history project into smaller steps.',note:'',toParent:true,toStudent:true},
 {id:3,date:'2026-10-27',wins:'Built a Sunday planner routine',focus:'',note:'',toParent:true,toStudent:true},
 {id:2,date:'2026-10-20',wins:'Practiced breaking big projects into steps',focus:'',note:'',toParent:true,toStudent:true},
 {id:1,date:'2026-10-13',wins:'Set up a homework-start timer',focus:'',note:'',toParent:true,toStudent:true}];
const kindMeta={session:{label:'Session',Ic:Users},task:{label:'Task',Ic:ListChecks},goal:{label:'Core goal',Ic:Target},log:{label:'Session log',Ic:ClipboardList}};

const DoneBadge=()=>(<span className="pop inline-flex items-center gap-1 bg-green-500 text-white text-xs font-bold rounded-full px-2.5 py-1 shrink-0"><CheckCircle2 size={13}/>Done!</span>);

function Login({onLogin}){
 const [email,setEmail]=useState('');
 const [password,setPassword]=useState('');
 const [error,setError]=useState('');
 const submit=(e)=>{
  e.preventDefault();
  const user=lookupUser(email);
  if(!user){setError('Account not recognized. Please contact your Skills 4Life Coach to set up your private access.');return}
  setError('');onLogin(user);
 };
 return(<div className="max-w-md mx-auto mt-6">
 <section className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
  <div className="flex flex-col items-center text-center mb-6">
   <Logo size={64}/>
   <h1 className="text-2xl font-extrabold text-slate-800 mt-3">Sign in</h1>
   <p className="text-slate4 text-sm mt-1">Use the email address your coach set up for you.</p>
  </div>
  <form onSubmit={submit} noValidate className="space-y-4">
   <label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">Email</span>
    <input type="email" autoComplete="username" value={email} onChange={e=>{setEmail(e.target.value);setError('')}} placeholder="you@example.com" aria-invalid={!!error} aria-describedby={error?'login-error':undefined} className="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand"/></label>
   <label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">Password</span>
    <input type="password" autoComplete="current-password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Enter your password" className="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand"/></label>
   {error&&<div id="login-error" role="alert" className="flex gap-2 items-start bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 text-sm"><AlertCircle size={18} className="shrink-0 mt-0.5"/><p>{error}</p></div>}
   <button type="submit" className="w-full bg-brand text-white font-semibold rounded-xl px-4 py-2.5 hover:bg-royal transition">Sign in</button>
  </form>
  <div className="mt-5 pt-4 border-t border-slate-100 text-xs text-slate4">
   <p className="font-semibold mb-1">Prototype test accounts (any password works):</p>
   <ul className="space-y-0.5">
    <li>Student: <span className="font-mono text-slate-700">student@skills4life.com</span></li>
    <li>Parent: <span className="font-mono text-slate-700">parent@skills4life.com</span></li>
    <li>Coach: <span className="font-mono text-slate-700">coach@skills4life.com</span></li>
   </ul>
  </div>
 </section></div>);
}

/* Shared by student and parent views: merges base events with logged tasks and core goals by due date. */
function CalendarSection({tasks,goals,today,sessions}){
 const [selectedDate,setSelectedDate]=useState(today);
 const [view,setView]=useState({y:parseISO(today).getFullYear(),m:parseISO(today).getMonth()});
 const eventsFor=(d,withDaily=true)=>[
  ...(baseEvents[d]||[]),
  ...sessions.filter(x=>x.date===d).map(x=>({k:'log',t:'Session logged',n:x.wins.split('\n')[0]||x.focus})),
  ...(withDaily&&d>=today?tasks.filter(t=>t.daily).map(t=>({k:'task',t:t.t,n:d===today&&t.done?'Completed today.':'Repeats daily.',done:d===today&&t.done})):[]),
  ...goals.filter(g=>g.due===d).map(g=>({k:'goal',t:g.g,n:g.done?'Completed.':`Progress: ${g.p}%`,done:g.done})),
  ...tasks.filter(t=>!t.daily&&t.due===d).map(t=>({k:'task',t:t.t,n:t.done?'Completed.':'Due this day.',done:t.done}))
 ];
 const items=eventsFor(selectedDate);
 const label=parseISO(selectedDate).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
 const monthLabel=new Date(view.y,view.m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
 const first=new Date(view.y,view.m,1).getDay();
 const days=new Date(view.y,view.m+1,0).getDate();
 const shift=(n)=>{const d=new Date(view.y,view.m+n,1);setView({y:d.getFullYear(),m:d.getMonth()})};
 const cells=[...Array(first).fill(null),...Array.from({length:days},(_,i)=>i+1)];
 return(<div className="lg:col-span-2 grid md:grid-cols-2 gap-5">
 <Card title={monthLabel} icon={CalendarDays} action={<div className="flex gap-1">
   <button type="button" onClick={()=>shift(-1)} aria-label="Previous month" className="p-1.5 rounded-lg hover:bg-slate-100"><ChevronLeft size={18}/></button>
   <button type="button" onClick={()=>shift(1)} aria-label="Next month" className="p-1.5 rounded-lg hover:bg-slate-100"><ChevronRight size={18}/></button></div>}>
  <div className="grid grid-cols-7 gap-1 text-center text-xs text-slate4 mb-1">{['S','M','T','W','T','F','S'].map((d,i)=><div key={i}>{d}</div>)}</div>
  <div className="grid grid-cols-7 gap-1">{cells.map((d,i)=>{
   if(!d)return <div key={'b'+i}/>;
   const key=iso(view.y,view.m,d);
   const sel=key===selectedDate,has=eventsFor(key,false).length>0,isToday=key===today;
   return(<button key={key} type="button" onClick={()=>setSelectedDate(key)} aria-pressed={sel}
    aria-label={parseISO(key).toLocaleDateString('en-US',{month:'long',day:'numeric'})+(has?', has items':'')+(isToday?', today':'')}
    className={'aspect-square rounded-full flex flex-col items-center justify-center text-sm transition cursor-pointer '+
     (sel?'bg-royal text-white font-bold shadow-md ring-2 ring-royal ring-offset-2':(has?'bg-brand/10 text-brand font-bold hover:bg-brand/20':'text-slate-600 hover:bg-slate-100'))+
     (!sel&&isToday?' ring-2 ring-brand':'')}>
    {d}{has&&<span className={'w-1.5 h-1.5 rounded-full mt-0.5 '+(sel?'bg-white':'bg-brand')}/>}
   </button>);})}</div>
  <p className="text-xs text-slate4 mt-3">Click a day to see what is scheduled. Dots mark days with items. Today has a thin outline.</p>
 </Card>
 <Card title="Schedule for Selected Date" icon={ListChecks}>
  <div aria-live="polite">
   <p className="font-bold text-royal mb-3">{label}{selectedDate===today&&<span className="ml-2 text-xs font-semibold text-slate4">Today</span>}</p>
   {items.length===0
    ?<div className="text-center py-10 text-slate4"><CalendarDays className="mx-auto mb-2" size={28}/><p>No sessions or tasks scheduled for this day.</p></div>
    :<ul className="space-y-3">{items.map((it,i)=>{const M=kindMeta[it.k];return(
      <li key={i} className={'flex gap-3 p-3 rounded-xl border '+(it.done?'border-green-200 bg-green-50':'border-slate-200 bg-slate-50')}>
       <M.Ic size={20} className={(it.done?'text-green-600':'text-brand')+' mt-0.5 shrink-0'}/>
       <div className="flex-1"><p className="text-xs font-semibold text-slate4">{M.label}</p><p className={'font-semibold '+(it.done?'line-through text-slate-400':'text-slate-800')}>{it.t}</p><p className="text-sm text-slate-600">{it.n}</p></div>
       {it.done&&<DoneBadge/>}
      </li>);})}</ul>}
  </div>
 </Card></div>);
}

function LogForm({onAdd}){
 const [title,setTitle]=useState('');
 const [due,setDue]=useState('');
 const [core,setCore]=useState(false);
 const [daily,setDaily]=useState(false);
 const [msg,setMsg]=useState('');
 const [err,setErr]=useState('');
 const submit=(e)=>{
  e.preventDefault();
  if(!title.trim()){setErr('Enter a task title, like "Math Worksheet Pg 45".');setMsg('');return}
  onAdd({title:title.trim(),due,core,daily:daily&&!core});
  setMsg(core?'Added to My Core Goals.':daily?'Added to Task List & Planner. It repeats every day.':'Added to Task List & Planner.'+(due?' It now shows on the calendar.':''));
  setErr('');setTitle('');setDue('');setCore(false);setDaily(false);
 };
 const inp="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand bg-white";
 return(<div className="lg:col-span-2"><Card title="➕ Log New Assignment or Habit">
  <form onSubmit={submit} noValidate className="space-y-4">
   <div className="grid md:grid-cols-[1fr_190px_auto] gap-3 items-end">
    <label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">Task Title</span>
     <input value={title} onChange={e=>{setTitle(e.target.value);setErr('');setMsg('')}} placeholder="e.g., Math Worksheet Pg 45" aria-invalid={!!err} className={inp}/></label>
    <label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">Due Date</span>
     <input type="date" value={due} disabled={daily&&!core} onChange={e=>{setDue(e.target.value);setMsg('')}} className={inp+(daily&&!core?' opacity-50':'')}/></label>
    <button type="submit" className="flex items-center justify-center gap-1.5 bg-brand text-white font-semibold rounded-xl px-5 py-2.5 hover:bg-royal transition">{core?'Add Core Goal':'Add Task'}</button>
   </div>
   <button type="button" role="switch" aria-checked={core} onClick={()=>setCore(!core)} className={'w-full flex items-center gap-3 text-left rounded-xl border p-3 transition '+(core?'border-brand bg-brand/5':'border-slate-200 bg-slate-50')}>
    <span className={'w-11 h-6 rounded-full p-0.5 transition shrink-0 '+(core?'bg-brand':'bg-slate-300')}><span className={'block w-5 h-5 bg-white rounded-full transition '+(core?'translate-x-5':'')}/></span>
    <span className="text-sm font-semibold text-slate-800">Is this a high-level milestone or core goal?</span></button>
   {!core&&<button type="button" role="switch" aria-checked={daily} onClick={()=>{setDaily(!daily);setMsg('')}} className={'w-full flex items-center gap-3 text-left rounded-xl border p-3 transition '+(daily?'border-brand bg-brand/5':'border-slate-200 bg-slate-50')}>
    <span className={'w-11 h-6 rounded-full p-0.5 transition shrink-0 '+(daily?'bg-brand':'bg-slate-300')}><span className={'block w-5 h-5 bg-white rounded-full transition '+(daily?'translate-x-5':'')}/></span>
    <span className="text-sm font-semibold text-slate-800">Repeat every day? (habit)</span></button>}
   <div aria-live="polite">
    {err&&<p role="alert" className="text-sm text-red-700">{err}</p>}
    {msg&&<p className="text-sm font-semibold text-green-700">{msg}</p>}
   </div>
  </form></Card></div>);
}

function Student({tasks,toggleTask,goals,setGoals,addItem,today,sessions}){
 const done=tasks.filter(t=>t.done).length;
 const toggle=toggleTask;
 return(<div className="grid lg:grid-cols-2 gap-5">
 <Card title="Task List & Planner" icon={ListChecks} action={<span className="text-sm text-slate4">{done}/{tasks.length} done</span>}>
  {tasks.length>0&&done===tasks.length&&<div className="pop flex items-center gap-2 bg-green-50 border border-green-200 text-green-700 font-semibold rounded-xl p-3 mb-3 text-sm"><PartyPopper size={18}/>Every task is done. Great work!</div>}
  <ul className="space-y-2">{tasks.map(t=>(<li key={t.id}><button role="checkbox" aria-checked={t.done} onClick={()=>toggle(t.id)} className={'w-full flex items-center gap-3 p-3 rounded-xl text-left transition '+(t.done?'bg-green-50 border border-green-200':'hover:bg-slate-50 border border-transparent')}>
   {t.done?<CheckCircle2 className="text-green-500 pop" size={22}/>:<Circle className="text-slate-400" size={22}/>}
   <span className={'flex-1 '+(t.done?'line-through text-slate-400':'text-slate-800')}>{t.t}</span>
   {t.done?<DoneBadge/>:<span className="text-xs text-slate4">{t.daily?'Daily':t.due?'Due '+fmtShort(t.due):'Anytime'}</span>}</button></li>))}</ul>
 </Card>
 <Card title="My Core Goals" icon={Target}>
  <div className="space-y-4">{goals.map(g=>(<div key={g.id}><div className="flex justify-between gap-3 text-sm mb-1"><span className="font-medium text-slate-700">{g.g}{g.due&&<span className="ml-2 text-xs text-slate4">Due {fmtShort(g.due)}</span>}</span><span className={(g.p===100?'text-green-600':'text-brand')+' font-bold'}>{g.p===100?'Reached! 🎉':g.p+'%'}</span></div>
   <div className="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div className={'h-full rounded-full transition-all '+(g.p===100?'bg-green-500':'bg-brand')} style={{width:g.p+'%'}}/></div>
   <input type="range" min="0" max="100" value={g.p} aria-label={'Progress: '+g.g} onChange={e=>setGoals(goals.map(x=>x.id===g.id?{...x,p:+e.target.value,done:+e.target.value===100}:x))} className="w-full mt-2 accent-brand"/></div>))}</div>
 </Card>
 <Card title="Weekly Planner" icon={ClipboardList}>
  <div className="divide-y divide-slate-100">{planner.map(([d,t,tm])=>(<div key={d} className="flex items-center gap-4 py-2.5"><span className="w-12 font-bold text-brand">{d}</span><span className="flex-1 text-slate-700">{t}</span><span className="flex items-center gap-1 text-xs text-slate4"><Clock size={13}/>{tm} pm</span></div>))}</div>
 </Card>
 <Card title="Session Log" icon={ClipboardList}>
  {sessions.length===0?<p className="text-sm text-slate4">Your coach hasn’t shared a session log yet.</p>
  :<div className="divide-y divide-slate-100">{sessions.map(x=>(<div key={x.id} className="flex gap-4 py-2.5"><span className="w-16 font-bold text-brand shrink-0">{fmtShort(x.date)}</span><div className="text-slate-700 text-sm"><p className="whitespace-pre-wrap">{x.wins||'No wins logged.'}</p>{x.focus&&<p className="text-slate4 mt-1">Next focus: {x.focus}</p>}</div></div>))}</div>}
 </Card>
 <CalendarSection tasks={tasks} goals={goals} today={today} sessions={sessions}/>
 <LogForm onAdd={addItem}/></div>);
}

function Parent({sessions,wins,tasks,goals,today}){
 const latest=sessions[0];
 const dl=()=>{const txt=`SKILLS 4LIFE COACHING - PARENT REPORT\n=====================================\nSession date: ${fmtShort(latest.date)}\n\nWins this session:\n${latest.wins}\n\nFocus for next time:\n${latest.focus}\n\nNotes for parents:\n${latest.note||'None'}\n`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='parent-report.txt';a.click()};
 return(<div className="grid lg:grid-cols-2 gap-5">
 <Card title="Latest Session Update" icon={Users} action={latest&&<button onClick={dl} className="flex items-center gap-1.5 bg-brand text-white text-sm font-semibold rounded-xl px-3 py-1.5"><Download size={15}/>Download report</button>}>
  {latest?(<div className="space-y-4 text-slate-700"><p className="text-xs text-slate4">Session on {fmtShort(latest.date)}</p>
   <div><h4 className="font-bold text-slate-800 mb-1">Wins</h4><p className="whitespace-pre-wrap">{latest.wins||'Nothing logged yet.'}</p></div>
   <div><h4 className="font-bold text-slate-800 mb-1">Focus for next time</h4><p className="whitespace-pre-wrap">{latest.focus||'Nothing logged yet.'}</p></div>
   {latest.note&&<div className="bg-brand/5 rounded-xl p-3"><h4 className="font-bold text-slate-800 mb-1">Note from your coach</h4><p className="whitespace-pre-wrap">{latest.note}</p></div>}</div>)
  :(<div className="text-center py-10 text-slate4"><EyeOff className="mx-auto mb-2" size={28}/><p>Your coach hasn’t shared a session log yet. Check back after the next session.</p></div>)}
 </Card>
 <Card title="Wins Tracker" icon={Trophy}>
  <ul className="space-y-3">{wins.map((w,i)=>(<li key={i} className="flex gap-3"><Sparkles size={18} className="text-brand mt-0.5 shrink-0"/><div><p className="text-slate-800">{w.t}</p><p className="text-xs text-slate4">{w.d}</p></div></li>))}</ul>
 </Card>
 <Card title="Session Log" icon={ClipboardList}>
  {sessions.length===0?<p className="text-sm text-slate4">No session logs shared yet.</p>
  :<div className="divide-y divide-slate-100">{sessions.map(x=>(<div key={x.id} className="flex gap-4 py-2.5"><span className="w-16 font-bold text-brand shrink-0">{fmtShort(x.date)}</span><div className="text-slate-700 text-sm"><p className="whitespace-pre-wrap">{x.wins||x.focus}</p>{x.wins&&x.focus&&<p className="text-slate4 mt-1">Next focus: {x.focus}</p>}</div></div>))}</div>}
 </Card>
 <CalendarSection tasks={tasks} goals={goals} today={today} sessions={sessions}/></div>);
}

function Switch({on,toggle,label,hint}){
 return(<button type="button" role="switch" aria-checked={on} onClick={toggle} className="w-full flex items-center gap-3 text-left">
  <span className={'w-12 h-7 rounded-full p-1 transition shrink-0 '+(on?'bg-brand':'bg-slate-300')}><span className={'block w-5 h-5 bg-white rounded-full transition '+(on?'translate-x-5':'')}/></span>
  <span><span className="block font-semibold text-slate-800">{label}</span><span className="block text-xs text-slate4">{hint}</span></span></button>);
}

function Coach({report,setReport,saveSession,sessions}){
 const [msg,setMsg]=useState('');
 const [err,setErr]=useState('');
 const set=(k,v)=>{setReport({...report,[k]:v});setMsg('');setErr('')};
 /* Called as a function, not used as a component, so typing keeps focus in the text boxes. */
 const field=(label,k,ph,rows=4)=>(<label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">{label}</span>
  <textarea rows={rows} value={report[k]} onChange={e=>set(k,e.target.value)} placeholder={ph} className="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand"/></label>);
 const save=()=>{
  if(!report.wins.trim()&&!report.focus.trim()){setErr('Add a win or a focus before saving.');return}
  const who=[report.toParent&&'parent',report.toStudent&&'student'].filter(Boolean).join(' and ');
  saveSession();setMsg('Session log saved. Visible to: '+(who||'coach only')+'.');setErr('');
 };
 const badge=(x)=>[x.toParent&&'Parent',x.toStudent&&'Student'].filter(Boolean);
 return(<div className="grid lg:grid-cols-3 gap-5">
 <div className="lg:col-span-2"><Card title="Session Notes" icon={ClipboardList}><div className="space-y-4">
  <label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">Session date</span><input type="date" value={report.date} onChange={e=>set('date',e.target.value)} className="border border-slate-300 rounded-xl px-3 py-2"/></label>
  {field('Wins this session','wins','What went well? One win per line.')}
  {field('Focus for next time','focus','What will we work on next?')}
  {field('Note for parents (optional)','note','Anything parents can support at home?',3)}
  <div className="flex flex-wrap gap-3 items-center"><button onClick={save} className="flex items-center gap-2 bg-brand text-white font-semibold rounded-xl px-4 py-2"><Send size={16}/>Save session log</button>
   <span aria-live="polite" className="text-sm">{err?<span role="alert" className="text-red-700">{err}</span>:<span className="text-green-700 font-medium">{msg}</span>}</span></div>
 </div></Card></div>
 <div className="space-y-5">
 <Card title="Who Can See This Log" icon={Eye}>
  <div className="space-y-4">
   <Switch on={report.toParent} toggle={()=>set('toParent',!report.toParent)} label={report.toParent?'Shown to parent':'Hidden from parent'} hint="Latest update, session log, wins tracker"/>
   <Switch on={report.toStudent} toggle={()=>set('toStudent',!report.toStudent)} label={report.toStudent?'Shown to student':'Hidden from student'} hint="Session log (the parent note is never shown)"/>
  </div>
 </Card>
 <Card title="Saved Logs" icon={ClipboardList}>
  <div className="divide-y divide-slate-100">{sessions.map(x=>(<div key={x.id} className="py-2.5"><div className="flex items-center justify-between gap-2"><span className="font-bold text-brand">{fmtShort(x.date)}</span>
   <span className="flex gap-1 flex-wrap justify-end">{(badge(x).length?badge(x):['Coach only']).map(b=><span key={b} className="text-xs font-semibold bg-brand/10 text-brand rounded-full px-2 py-0.5">{b}</span>)}</span></div>
   <p className="text-sm text-slate-700 mt-1">{x.wins.split('\n')[0]||x.focus}</p></div>))}</div>
 </Card></div></div>);
}

function App(){
 /* The role comes only from the email lookup at sign-in; it cannot be changed from the UI afterward. */
 const [user,setUser]=useState(null);
 const role=user?user.role:null;
 /* The coach's draft; saving turns it into an entry in `sessions`, with its own parent/student visibility. */
 const blank=()=>({date:todayISO(),wins:'',focus:'',note:'',toParent:true,toStudent:true});
 const [report,setReport]=useState(blank());
 const [sessions,setSessions]=useState(initSessions);
 const [wins,setWins]=useState([{t:'Turned in every assignment on time',d:'Oct 27'},{t:'Asked a teacher for help before the due date',d:'Oct 20'}]);
 /* Shared app memory: tasks and core goals live here so the student, parent, and calendar views all read the same data. */
 const [tasks,setTasks]=useState(initTasks);
 const [today,setToday]=useState(todayISO());
 useEffect(()=>{const id=setInterval(()=>setToday(todayISO()),60000);return()=>clearInterval(id)},[]);
 /* Daily tasks are done only for the day they were checked off, so they reset each morning. */
 const view=tasks.map(t=>t.daily?{...t,done:t.doneOn===today}:t);
 const toggleTask=(id)=>setTasks(ts=>ts.map(t=>t.id!==id?t:t.daily?{...t,doneOn:t.doneOn===today?'':today}:{...t,done:!t.done}));
 const [goals,setGoals]=useState(initGoals);
 const addItem=({title,due,core,daily})=>{
  const id=Date.now();
  if(core)setGoals(g=>[...g,{id,g:title,p:0,due,done:false}]);
  else setTasks(t=>[...t,daily?{id,t:title,due:'',daily:true,doneOn:''}:{id,t:title,due,done:false}]);
 };
 const saveSession=()=>{
  const e={id:Date.now(),date:report.date,wins:report.wins.trim(),focus:report.focus.trim(),note:report.note.trim(),toParent:report.toParent,toStudent:report.toStudent};
  setSessions(x=>[e,...x].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id));
  if(e.toParent){const n=e.wins.split('\n').map(t=>t.trim()).filter(Boolean).filter(t=>!wins.some(w=>w.t===t)).map(t=>({t,d:fmtShort(e.date)}));setWins([...n,...wins])}
  setReport({...blank(),date:report.date,toParent:report.toParent,toStudent:report.toStudent});
 };
 return(<div className="min-h-screen">
  <header className="bg-white border-b border-slate-200 sticky top-0 z-10">
   <div className="max-w-6xl mx-auto px-5 py-3 flex flex-wrap items-center justify-between gap-3">
    <div className="flex items-center gap-3"><Logo/><div className="leading-tight"><div className="text-xl font-extrabold text-brand tracking-tight">Skills 4Life</div><div className="text-xs font-semibold text-slate4 tracking-[0.25em]">COACHING</div></div></div>
    {user&&<button onClick={()=>setUser(null)} className="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 text-slate4 hover:text-slate-900 transition"><LogOut size={16}/>Sign out</button>}
   </div></header>
  <main className="max-w-6xl mx-auto px-5 py-8">
   {!user&&<Login onLogin={setUser}/>}
   {user&&<>
    <h1 className="text-2xl font-extrabold text-slate-800 mb-1">{role==='student'?'Student Dashboard':role==='parent'?'Parent Portal':'Coach Dashboard'}</h1>
    <p className="text-slate4 mb-6">{role==='student'?'Your tasks, plans, and goals for this week.':role==='parent'?'Progress, session updates, and wins.':'Log the session and choose what parents can see.'}</p>
    {role==='student'&&<Student tasks={view} toggleTask={toggleTask} goals={goals} setGoals={setGoals} addItem={addItem} today={today} sessions={sessions.filter(x=>x.toStudent)}/>}
    {role==='parent'&&<Parent sessions={sessions.filter(x=>x.toParent)} wins={wins} tasks={view} goals={goals} today={today}/>}
    {role==='coach'&&<Coach report={report} setReport={setReport} saveSession={saveSession} sessions={sessions}/>}
   </>}
  </main>
  <footer className="text-center text-xs text-slate4 pb-8">Skills 4Life Coaching · Executive function skills for life</footer>
 </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

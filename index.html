 <path d="M26 22c2 1 3 3 2 5m8-5c-2 1-3 3-2 5m-7 4c2 0 3 1 4 2m6-2c-2 0-3 1-4 2" stroke="#fff" strokeWidth="1.2" fill="none" strokeLinecap="round"/>
 <path d="M26 35h12v4c0 2-2 3-3 4v1.500h-6V43c-1-1-3-2-3-4z" fill="#707070"/>
 <rect x="27.500" y="46" width="9" height="2" rx="1" fill="#3B62FF"/><rect x="29" y="49.500" width="6" height="1.800" rx=".9" fill="#3B62FF"/>
</svg>);

const Card=({title,icon:Ic,children,action})=>(
<section className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
 <div className="flex items-center justify-between mb-4 gap-3 flex-wrap"><h3 className="flex items-center gap-2 font-bold text-slate-800">{Ic&&<Ic size={18} className="text-brand"/>}{title}</h3>{action}</div>
 {children}
</section>);

/* Dates are stored as ISO strings (YYYY-MM-DD) so the calendar can match them exactly. */
const pad=(n)=>String(n).padStart(2,'0');
const iso=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const parseISO=(s)=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dateToISO=(d)=>iso(d.getFullYear(),d.getMonth(),d.getDate());
const todayISO=()=>dateToISO(new Date());
const fmtShort=(s)=>parseISO(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});

/* Goal progress is never stored. It is always calculated from the goal's action steps. */
const goalStats=(g)=>{
 const total=g.steps.length;
 const done=g.steps.filter(s=>s.done).length;
 const pct=total?Math.round((done/total)*100):0;
 return {total,done,pct,achieved:total>0&&done===total};
};
const newId=()=>Date.now()+Math.floor(Math.random()*100000);

/* Homework, daily tasks and habits. Daily items (and all habits) reset every day: completion is stored per date in doneDates. */
const isDoneToday=(x,today)=>x.daily?x.doneDates.includes(today):x.done;
const streakOf=(x,today)=>{
 let n=0;const d=parseISO(today);
 if(!x.doneDates.includes(today))d.setDate(d.getDate()-1);
 while(x.doneDates.includes(dateToISO(d))){n++;d.setDate(d.getDate()-1)}
 return n;
};
const typeMeta={
 homework:{label:'Homework',plural:'Homework Assignments'},
 task:{label:'Daily Task',plural:'Daily Tasks'},
 habit:{label:'Habit',plural:'Habit Entries'}
};

const initGoals=[
 {id:1,g:'Start homework within 15 minutes of arriving home',due:'',steps:[
  {id:101,t:'Set the homework-start timer',done:true},
  {id:102,t:'Put phone in the basket before starting',done:true},
  {id:103,t:'Start on time 3 days in a row',done:true},
  {id:104,t:'Start on time 4 days in a row',done:false},
  {id:105,t:'Start on time all 5 school days',done:false}]},
 {id:2,g:'Use planner for every assignment',due:'2026-11-07',steps:[
  {id:201,t:'Write down every assignment on Monday',done:true},
  {id:202,t:'Write down every assignment on Tuesday',done:true},
  {id:203,t:'Write down every assignment on Wednesday',done:true},
  {id:204,t:'Write down every assignment on Thursday',done:true},
  {id:205,t:'Write down every assignment on Friday',done:false}]},
 {id:3,g:'Ask for help before a deadline stress spike',due:'',steps:[
  {id:301,t:'Name my 3 go-to helpers',done:true},
  {id:302,t:'Practice asking out loud with my coach',done:false},
  {id:303,t:'Ask for help at least 2 days before a due date',done:false}]}
];

const initTasks=[
 {id:1001,t:'History project: draft the outline',type:'homework',date:'2026-11-12',daily:false,core:true,done:false,doneDates:[]},
 {id:1002,t:'Study for the quiz (10 minutes)',type:'homework',date:'2026-11-19',daily:false,core:false,done:false,doneDates:[]},
 {id:1003,t:'Pack backpack for tomorrow',type:'task',date:'2026-11-02',daily:true,core:false,done:false,doneDates:['2026-11-02','2026-11-03']},
 {id:1004,t:'Read for 10 minutes',type:'habit',date:'2026-11-02',daily:true,core:false,done:false,doneDates:['2026-11-02','2026-11-03']}
];

/* Fixed calendar items (coaching sessions, project deadline). Student goals, tasks and coach session logs are merged in live. */
const baseEvents=Object.fromEntries(Object.entries({
 3:[{k:'session',t:'Coaching session',n:'4:00 pm. Review homework and the homework-start timer.'}],
 10:[{k:'session',t:'Coaching session',n:'4:00 pm. Check progress on the history project.'}],
 17:[{k:'session',t:'Coaching session',n:'4:00 pm. Goal review.'}],
 24:[{k:'session',t:'Coaching session',n:'4:00 pm. Plan the project wrap-up.'}],
 26:[{k:'task',t:'History project due',n:'Final check: all three steps done.'}]
}).map(([d,v])=>[iso(2026,10,+d),v]));
const initSessions=[
 {id:4,date:'2026-11-02',wins:'Started homework on time 3 days in a row.\nUsed the planner without a reminder.',focus:'Breaking the history project into smaller steps.',note:'',toParent:true,toStudent:true},
 {id:3,date:'2026-10-27',wins:'Built a Sunday planner routine',focus:'',note:'',toParent:true,toStudent:true},
 {id:2,date:'2026-10-20',wins:'Practiced breaking big projects into steps',focus:'',note:'',toParent:true,toStudent:true},
 {id:1,date:'2026-10-13',wins:'Set up a homework-start timer',focus:'',note:'',toParent:true,toStudent:true}];
const kindMeta={
 session:{label:'Session',Ic:Users},
 task:{label:'Daily task',Ic:ListChecks},
 homework:{label:'Homework',Ic:BookOpen},
 habit:{label:'Habit',Ic:Repeat},
 goal:{label:'Core goal',Ic:Target},
 log:{label:'Session log',Ic:ClipboardList}};

const DoneBadge=()=>(<span className="pop inline-flex items-center gap-1 bg-green-500 text-white text-xs font-bold rounded-full px-2.5 py-1 shrink-0"><CheckCircle2 size={13}/>Done!</span>);

function Login({onLogin}){
 const [email,setEmail]=useState('');
 const [password,setPassword]=useState('');
 const [error,setError]=useState('');
 const submit=(e)=>{
  e.preventDefault();
  const user=lookupUser(email);
  if(!user){setError('Account not recognized. Please contact your Skills 4Life Coach to set up your private access.');return}
  setError('');onLogin(user);
 };
 return(<div className="max-w-md mx-auto mt-6">
 <section className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
  <div className="flex flex-col items-center text-center mb-6">
   <Logo size={64}/>
   <h1 className="text-2xl font-extrabold text-slate-800 mt-3">Sign in</h1>
   <p className="text-slate4 text-sm mt-1">Use the email address your coach set up for you.</p>
  </div>
  <form onSubmit={submit} noValidate className="space-y-4">
   <label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">Email</span>
    <input type="email" autoComplete="username" value={email} onChange={e=>{setEmail(e.target.value);setError('')}} placeholder="you@example.com" aria-invalid={!!error} aria-describedby={error?'login-error':undefined} className="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand"/></label>
   <label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">Password</span>
    <input type="password" autoComplete="current-password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Enter your password" className="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand"/></label>
   {error&&<div id="login-error" role="alert" className="flex gap-2 items-start bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 text-sm"><AlertCircle size={18} className="shrink-0 mt-0.5"/><p>{error}</p></div>}
   <button type="submit" className="w-full bg-brand text-white font-semibold rounded-xl px-4 py-2.5 hover:bg-royal transition">Sign in</button>
  </form>
  <div className="mt-5 pt-4 border-t border-slate-100 text-xs text-slate4">
   <p className="font-semibold mb-1">Prototype test accounts (any password works):</p>
   <ul className="space-y-0.5">
    <li>Student: <span className="font-mono text-slate-700">student@skills4life.com</span></li>
    <li>Parent: <span className="font-mono text-slate-700">parent@skills4life.com</span></li>
    <li>Coach: <span className="font-mono text-slate-700">coach@skills4life.com</span></li>
   </ul>
  </div>
 </section></div>);
}

/* Shared by student and parent views. The student passes sessions=[] so no session-log text appears there. Only the student passes tasks. */
function CalendarSection({goals,today,sessions,tasks=[]}){
 const [selectedDate,setSelectedDate]=useState(today);
 const [view,setView]=useState({y:parseISO(today).getFullYear(),m:parseISO(today).getMonth()});
 const taskEvents=(d)=>tasks.flatMap(x=>{
  if(x.daily){
   if(x.doneDates.includes(d))return [{k:x.type,t:x.t,n:x.type==='habit'?'Habit completed':'Daily task completed',done:true}];
   if(x.date===d)return [{k:x.type,t:x.t,n:'Starts today and repeats every day.',done:false}];
   return [];
  }
  if(x.date===d)return [{k:x.type,t:x.t,n:x.done?'Completed':'Due today',done:x.done}];
  return [];
 });
 const eventsFor=(d)=>[
  ...(baseEvents[d]||[]),
  ...taskEvents(d),
  ...sessions.filter(x=>x.date===d).map(x=>({k:'log',t:'Session logged',n:x.wins.split('\n')[0]||x.focus})),
  ...goals.filter(g=>g.due===d).map(g=>{const s=goalStats(g);return {k:'goal',t:g.g,n:s.achieved?'Goal achieved! 🎉':`Progress: ${s.pct}% (${s.done} of ${s.total} action steps)`,done:s.achieved}})
 ];
 const items=eventsFor(selectedDate);
 const label=parseISO(selectedDate).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
 const monthLabel=new Date(view.y,view.m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
 const first=new Date(view.y,view.m,1).getDay();
 const days=new Date(view.y,view.m+1,0).getDate();
 const shift=(n)=>{const d=new Date(view.y,view.m+n,1);setView({y:d.getFullYear(),m:d.getMonth()})};
 const cells=[...Array(first).fill(null),...Array.from({length:days},(_,i)=>i+1)];
 return(<div className="lg:col-span-2 grid md:grid-cols-2 gap-5 print-hide-cal">
 <Card title={monthLabel} icon={CalendarDays} action={<div className="flex gap-1 items-center">
   <button type="button" onClick={()=>shift(-1)} aria-label="Previous month" className="w-9 h-9 rounded-lg bg-slate-100 text-brand text-xl font-bold leading-none hover:bg-brand/10">&lsaquo;</button>
   <button type="button" onClick={()=>{setView({y:parseISO(today).getFullYear(),m:parseISO(today).getMonth()});setSelectedDate(today)}} className="h-9 px-3 rounded-lg bg-slate-100 text-brand text-sm font-semibold hover:bg-brand/10">Today</button>
   <button type="button" onClick={()=>shift(1)} aria-label="Next month" className="w-9 h-9 rounded-lg bg-slate-100 text-brand text-xl font-bold leading-none hover:bg-brand/10">&rsaquo;</button></div>}>
  <div className="grid grid-cols-7 gap-1 text-center text-xs text-slate4 mb-1">{['S','M','T','W','T','F','S'].map((d,i)=><div key={i}>{d}</div>)}</div>
  <div className="grid grid-cols-7 gap-1">{cells.map((d,i)=>{
   if(!d)return <div key={'b'+i}/>;
   const key=iso(view.y,view.m,d);
   const sel=key===selectedDate,has=eventsFor(key).length>0,isToday=key===today;
   return(<button key={key} type="button" onClick={()=>setSelectedDate(key)} aria-pressed={sel}
    aria-label={parseISO(key).toLocaleDateString('en-US',{month:'long',day:'numeric'})+(has?', has items':'')+(isToday?', today':'')}
    className={'aspect-square rounded-full flex flex-col items-center justify-center text-sm transition cursor-pointer '+
     (sel?'bg-royal text-white font-bold shadow-md ring-2 ring-royal ring-offset-2':(has?'bg-brand/10 text-brand font-bold hover:bg-brand/20':'text-slate-600 hover:bg-slate-100'))+
     (!sel&&isToday?' ring-2 ring-brand':'')}>
    {d}{has&&<span className={'w-1.5 h-1.5 rounded-full mt-0.5 '+(sel?'bg-white':'bg-brand')}/>}
   </button>);})}</div>
  <p className="text-xs text-slate4 mt-3">Click a day to see what is scheduled. Dots mark days with items. Today has a thin outline.</p>
 </Card>
 <Card title="Schedule for Selected Date" icon={ListChecks}>
  <div aria-live="polite">
   <p className="font-bold text-royal mb-3">{label}{selectedDate===today&&<span className="ml-2 text-xs font-semibold text-slate4">Today</span>}</p>
   {items.length===0
    ?<div className="text-center py-10 text-slate4"><CalendarDays className="mx-auto mb-2" size={28}/><p>No sessions or goals scheduled for this day.</p></div>
    :<ul className="space-y-3">{items.map((it,i)=>{const M=kindMeta[it.k];return(
      <li key={i} className={'flex gap-3 p-3 rounded-xl border '+(it.done?'border-green-200 bg-green-50':'border-slate-200 bg-slate-50')}>
       <M.Ic size={20} className={(it.done?'text-green-600':'text-brand')+' mt-0.5 shrink-0'}/>
       <div className="flex-1"><p className="text-xs font-semibold text-slate4">{M.label}</p><p className={'font-semibold '+(it.done?'line-through text-slate-400':'text-slate-800')}>{it.t}</p><p className="text-sm text-slate-600">{it.n}</p></div>
       {it.done&&<DoneBadge/>}
      </li>);})}</ul>}
  </div>
 </Card></div>);
}

/* Student form: create a personal goal with dynamic action steps (add as many as needed, one at a time). */
function GoalForm({onAdd}){
 const [title,setTitle]=useState('');
 const [due,setDue]=useState('');
 const [stepText,setStepText]=useState('');
 const [steps,setSteps]=useState([]);
 const [msg,setMsg]=useState('');
 const [err,setErr]=useState('');
 const clear=()=>{setMsg('');setErr('')};
 const addStep=()=>{const t=stepText.trim();if(!t)return;setSteps(s=>[...s,{id:newId(),t}]);setStepText('');clear()};
 const removeStep=(id)=>{setSteps(s=>s.filter(x=>x.id!==id));clear()};
 const submit=(e)=>{
  e.preventDefault();
  if(!title.trim()){setErr('Enter a goal title, like "Finish History Project".');setMsg('');return}
  const all=[...steps.map(s=>s.t),...(stepText.trim()?[stepText.trim()]:[])];
  if(all.length===0){setErr('Add at least one action step so your progress bar has something to fill.');setMsg('');return}
  onAdd({title:title.trim(),due,steps:all});
  setMsg(`Added "${title.trim()}" to My Core Goals with ${all.length} action step${all.length===1?'':'s'}.`+(due?' It now shows on the calendar.':''));
  setErr('');setTitle('');setDue('');setStepText('');setSteps([]);
 };
 const inp="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand bg-white";
 return(<Card title="Create a Personal Goal" icon={Target}>
  <form onSubmit={submit} noValidate className="space-y-4">
   <label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">Goal Title</span>
    <input value={title} onChange={e=>{setTitle(e.target.value);clear()}} placeholder="e.g., Finish History Project" aria-invalid={!!err&&!title.trim()} className={inp}/></label>
   <label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">Due Date (optional)</span>
    <input type="date" value={due} onChange={e=>{setDue(e.target.value);clear()}} className={inp}/></label>
   <div>
    <span className="block text-sm font-semibold text-slate-700 mb-1">Action Steps</span>
    <div className="flex gap-2">
     <input value={stepText} onChange={e=>{setStepText(e.target.value);clear()}} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addStep()}}} aria-label="New action step" placeholder="Type a step, then press Enter or Add Step" className={inp}/>
     <button type="button" onClick={addStep} className="flex items-center gap-1 bg-slate-100 text-brand font-semibold rounded-xl px-4 py-2 hover:bg-brand/10 transition shrink-0"><Plus size={16}/>Add Step</button>
    </div>
    {steps.length>0&&<ol className="mt-3 space-y-1.5">{steps.map((s,i)=>(<li key={s.id} className="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
     <span className="font-bold text-brand w-5">{i+1}.</span><span className="flex-1 text-slate-800">{s.t}</span>
     <button type="button" onClick={()=>removeStep(s.id)} aria-label={'Remove step: '+s.t} className="p-1 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50"><X size={14}/></button></li>))}</ol>}
    <p className="text-xs text-slate4 mt-2">Your progress bar fills automatically as you check off each step.</p>
   </div>
   <button type="submit" className="w-full flex items-center justify-center gap-1.5 bg-brand text-white font-semibold rounded-xl px-5 py-2.5 hover:bg-royal transition"><Plus size={16}/>Add Core Goal</button>
   <div aria-live="polite">
    {err&&<p role="alert" className="text-sm text-red-700">{err}</p>}
    {msg&&<p className="text-sm font-semibold text-green-700">{msg}</p>}
   </div>
  </form></Card>);
}

/* One core goal: automated progress bar, checkable action steps, and an add-step box. */
function GoalCard({goal,toggleStep,addStep,removeStep}){
 const [text,setText]=useState('');
 const s=goalStats(goal);
 const submit=(e)=>{e.preventDefault();if(!text.trim())return;addStep(goal.id,text.trim());setText('')};
 return(<div className={'rounded-xl border p-4 transition '+(s.achieved?'border-green-300 bg-green-50':'border-slate-200 bg-white')}>
  <div className="flex items-start justify-between gap-3 mb-2">
   <div className="min-w-0">
    {goal.assigned&&<span className="inline-block text-xs font-bold bg-brand/10 text-brand rounded-full px-2 py-0.5 mb-1">Assigned by your coach</span>}
    <p className="font-semibold text-slate-800">{goal.g}</p>
    {goal.due&&<p className="text-xs text-slate4 mt-0.5">Due {fmtShort(goal.due)}</p>}
   </div>
   {s.achieved
    ?<span className="pop inline-flex items-center gap-1.5 bg-green-500 text-white text-sm font-bold rounded-full px-3 py-1.5 shrink-0"><Trophy size={15}/>Goal Achieved! 🎉</span>
    :<span className="text-brand font-bold shrink-0">{s.pct}%</span>}
  </div>
  <div className="h-3 bg-slate-100 rounded-full overflow-hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={s.pct} aria-label={'Progress for '+goal.g}>
   <div className={'h-full rounded-full transition-all duration-500 '+(s.achieved?'bg-green-500':'bg-brand')} style={{width:s.pct+'%'}}/>
  </div>
  <p className="text-xs text-slate4 mt-1.5">{s.total===0?'Add your first action step to start tracking progress.':`${s.done} of ${s.total} action step${s.total===1?'':'s'} done`}</p>
  {s.total>0&&<ul className="mt-3 space-y-1">{goal.steps.map((st,i)=>(<li key={st.id} className="flex items-center gap-1">
   <button type="button" role="checkbox" aria-checked={st.done} onClick={()=>toggleStep(goal.id,st.id)} className={'flex-1 min-w-0 flex items-center gap-2.5 p-2 rounded-lg text-left text-sm transition '+(st.done?'bg-green-50':'hover:bg-slate-50')}>
    {st.done?<CheckCircle2 className="text-green-500 shrink-0" size={20}/>:<Circle className="text-slate-400 shrink-0" size={20}/>}

/* Coach panel: build a goal with a title, due date, and any number of action steps, then push it into the shared goals array. */
function GoalAssigner({onAssign,goals}){
 const [title,setTitle]=useState('');
 const [due,setDue]=useState('');
 const [stepText,setStepText]=useState('');
 const [steps,setSteps]=useState([]);
 const [msg,setMsg]=useState('');
 const [err,setErr]=useState('');
 const clear=()=>{setMsg('');setErr('')};
 const addStep=()=>{const t=stepText.trim();if(!t)return;setSteps(s=>[...s,{id:newId(),t}]);setStepText('');clear()};
 const removeStep=(id)=>{setSteps(s=>s.filter(x=>x.id!==id));clear()};
 const submit=(e)=>{
  e.preventDefault();
  if(!title.trim()){setErr('Enter a goal title, like "Master Semester Study Schedule".');setMsg('');return}
  const all=[...steps.map(s=>s.t),...(stepText.trim()?[stepText.trim()]:[])];
  if(all.length===0){setErr('Add at least one action step so the student has a progress bar to fill.');setMsg('');return}
  onAssign({title:title.trim(),due,steps:all});
  setMsg(`Assigned "${title.trim()}" with ${all.length} action step${all.length===1?'':'s'}. Switch to the student account to see it.`);
  setErr('');setTitle('');setDue('');setStepText('');setSteps([]);
 };
 const inp="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand bg-white";
 return(<Card title="🎯 Assign New Student Goal" icon={Target}>

     <input value={title} onChange={e=>{setTitle(e.target.value);clear()}} placeholder="e.g., Master Semester Study Schedule" aria-invalid={!!err&&!title.trim()} className={inp}/></label>

     <input value={stepText} onChange={e=>{setStepText(e.target.value);clear()}} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addStep()}}} aria-label="New action step" placeholder="Type a step and press Enter or Add Step" className={inp}/>
     <button type="button" onClick={addStep} className="flex items-center gap-1 bg-slate-100 text-brand font-semibold rounded-xl px-4 py-2 hover:bg-brand/10 transition shrink-0"><Plus size={16}/>Add Step</button>

    <p className="text-xs text-slate4 mt-2">The student’s progress bar is calculated from these steps as they check them off.</p>
   </div>
   <div className="flex flex-wrap items-center gap-3">
    <button type="submit" className="flex items-center gap-2 bg-brand text-white font-semibold rounded-xl px-4 py-2 hover:bg-royal transition"><Send size={16}/>Assign Goal to Student</button>
    <span aria-live="polite" className="text-sm">{err?<span role="alert" className="text-red-700">{err}</span>:<span className="text-green-700 font-medium">{msg}</span>}</span>
   </div>
  </form>
  <div className="mt-5 pt-4 border-t border-slate-100">
   <h4 className="text-sm font-bold text-slate-800 mb-2">Student’s Current Goals</h4>
   {goals.length===0?<p className="text-sm text-slate4">No goals yet.</p>

    <div className="h-2 bg-slate-100 rounded-full overflow-hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={s.pct} aria-label={'Progress for '+g.g}><div className={'h-full rounded-full transition-all '+(s.achieved?'bg-green-500':'bg-brand')} style={{width:s.pct+'%'}}/></div>
    <p className="text-xs text-slate4 mt-1">{s.done} of {s.total} action steps done{g.due?' · Due '+fmtShort(g.due):''}</p></li>);})}</ul>}
  </div>
 </Card>);

function Coach({report,setReport,saveSession,sessions,goals,assignGoal}){

 };

 </div></Card></div>
 <div className="space-y-5">
 <Card title="Who Can See This Log" icon={Eye}>

   <Switch on={report.toStudent} toggle={()=>set('toStudent',!report.toStudent)} label={report.toStudent?'Shown to student':'Hidden from student'} hint="Kept on record; the student dashboard no longer displays session logs"/>
  </div>
 </Card>
 <Card title="Saved Logs" icon={ClipboardList}>
  <div className="divide-y divide-slate-100">{sessions.map(x=>(<div key={x.id} className="py-2.5"><div className="flex items-center justify-between gap-2"><span className="font-bold text-brand">{fmtShort(x.date)}</span>

   <p className="text-sm text-slate-700 mt-1">{x.wins.split('\n')[0]||x.focus}</p></div>))}</div>
 </Card></div>
 <div className="lg:col-span-3"><GoalAssigner onAssign={assignGoal} goals={goals}/></div></div>);

function App(){
 /* The role comes only from the email lookup at sign-in; it cannot be changed from the UI afterward. */
 const [user,setUser]=useState(null);
 const role=user?user.role:null;
 /* The coach's draft; saving turns it into an entry in `sessions`, with its own parent/student visibility. */
 const blank=()=>({date:todayISO(),wins:'',focus:'',note:'',toParent:true,toStudent:true});
 const [report,setReport]=useState(blank());
 const [sessions,setSessions]=useState(initSessions);
 const [wins,setWins]=useState([{t:'Turned in every assignment on time',d:'Oct 27'},{t:'Asked a teacher for help before the due date',d:'Oct 20'}]);
 /* Shared app memory: core goals and tasks live here so the student, parent, coach, and calendar views all read the same data. */
 const [today,setToday]=useState(todayISO());
 useEffect(()=>{const id=setInterval(()=>setToday(todayISO()),60000);return()=>clearInterval(id)},[]);
 const [goals,setGoals]=useState(initGoals);
 const [tasks,setTasks]=useState(initTasks);
 /* Goal action steps: progress is derived from these, so there is no manual progress value. */
 const toggleStep=(gid,sid)=>setGoals(gs=>gs.map(g=>g.id!==gid?g:{...g,steps:g.steps.map(s=>s.id===sid?{...s,done:!s.done}:s)}));
 const addStep=(gid,t)=>setGoals(gs=>gs.map(g=>g.id!==gid?g:{...g,steps:[...g.steps,{id:newId(),t,done:false}]}));
 const removeStep=(gid,sid)=>setGoals(gs=>gs.map(g=>g.id!==gid?g:{...g,steps:g.steps.filter(s=>s.id!==sid)}));
 const addGoal=({title,due,steps})=>setGoals(g=>[...g,{id:newId(),g:title,due,steps:steps.map(t=>({id:newId(),t,done:false}))}]);
 /* Coach pipeline: pushes a goal flagged `assigned` into the same array the student, parent, and calendar read. */
 const assignGoal=({title,due,steps})=>setGoals(g=>[...g,{id:newId(),g:title,due,assigned:true,steps:steps.map(t=>({id:newId(),t,done:false}))}]);
 /* Homework, daily tasks and habits. Daily items store completion per date, so they reset automatically each day. */
 const addTask=({t,type,date,daily,core})=>setTasks(x=>[...x,{id:newId(),t,type,date,daily,core,done:false,doneDates:[]}]);
 const toggleTask=(id)=>setTasks(xs=>xs.map(x=>{
  if(x.id!==id)return x;
  if(x.daily)return {...x,doneDates:x.doneDates.includes(today)?x.doneDates.filter(d=>d!==today):[...x.doneDates,today]};
  return {...x,done:!x.done};
 }));
 const removeTask=(id)=>setTasks(xs=>xs.filter(x=>x.id!==id));
 const saveSession=()=>{
  const e={id:Date.now(),date:report.date,wins:report.wins.trim(),focus:report.focus.trim(),note:report.note.trim(),toParent:report.toParent,toStudent:report.toStudent};
  setSessions(x=>[e,...x].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id));
  if(e.toParent){const n=e.wins.split('\n').map(t=>t.trim()).filter(Boolean).filter(t=>!wins.some(w=>w.t===t)).map(t=>({t,d:fmtShort(e.date)}));setWins([...n,...wins])}
  setReport({...blank(),date:report.date,toParent:report.toParent,toStudent:report.toStudent});
 };
 return(<div className="min-h-screen">
  <header className="bg-white border-b border-slate-200 sticky top-0 z-10">
   <div className="max-w-6xl mx-auto px-5 py-3 flex flex-wrap items-center justify-between gap-3">
    <div className="flex items-center gap-3"><Logo/><div className="leading-tight"><div className="text-xl font-extrabold text-brand tracking-tight">Skills 4Life</div><div className="text-xs font-semibold text-slate4 tracking-[0.25em]">COACHING</div></div></div>
    {user&&<button onClick={()=>setUser(null)} className="no-print flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 text-slate4 hover:text-slate-900 transition"><LogOut size={16}/>Sign out</button>}
   </div></header>
  <main className="max-w-6xl mx-auto px-5 py-8">
   {!user&&<Login onLogin={setUser}/>}
   {user&&<>
    <h1 className="text-2xl font-extrabold text-slate-800 mb-1">{role==='student'?'Student Dashboard':role==='parent'?'Parent Portal':'Coach Dashboard'}</h1>
    <p className="text-slate4 mb-6">{role==='student'?'Your goals, homework, daily tasks, habits, and calendar.':role==='parent'?'Progress, session updates, and wins.':'Log the session, assign goals, and choose what parents can see.'}</p>
    {role==='student'&&<Student goals={goals} toggleStep={toggleStep} addStep={addStep} removeStep={removeStep} addGoal={addGoal} tasks={tasks} addTask={addTask} toggleTask={toggleTask} removeTask={removeTask} today={today}/>}
    {role==='parent'&&<Parent sessions={sessions.filter(x=>x.toParent)} wins={wins} goals={goals} today={today}/>}
    {role==='coach'&&<Coach report={report} setReport={setReport} saveSession={saveSession} sessions={sessions} goals={goals} assignGoal={assignGoal}/>}
   </>}
  </main>
  <footer className="text-center text-xs text-slate4 pb-8">Skills 4Life Coaching · Executive function skills for life</footer>
 </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

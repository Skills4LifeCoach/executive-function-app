const [CheckCircle2,Circle,Plus,Target,CalendarDays,ListChecks,Users,ClipboardList,Download,Eye,EyeOff,Trophy,Send,Sparkles,LogOut,AlertCircle,ChevronLeft,ChevronRight,X,Printer,BookOpen,Repeat,Flame,Star]=

/* ------------------------------------------------------------------
   SUPABASE CONNECTION
   The publishable key is designed to live in the app. Your data stays private
   because of the Row Level Security rules in the database, not because this key is hidden.
   NEVER put the secret / service_role key in this file.
------------------------------------------------------------------- */
const SUPABASE_URL='https://rvlssgabmepyesvgewwy.supabase.co';
const SUPABASE_KEY='sb_publishable_Ntk8X5svXpInQ1rtTqFyRA_kRbMnKAS';
/* True when the person arrived by clicking a password-reset link in their email (checked before Supabase clears the URL). */
const RECOVERY_LINK=/type=recovery/.test(window.location.hash);
/* True when a reset link failed (expired, already used, or opened twice). The error is read from the address, then the address is tidied. */
const LINK_ERROR=/error_code=otp_expired|error=access_denied/.test(window.location.hash);
if(LINK_ERROR){try{window.history.replaceState(null,'',window.location.pathname+window.location.search)}catch(e){}}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* After a real sign-in, find out who this person is. The role comes only from which table
   their account appears in (coaches, parents, or students). The database's privacy rules
   decide which students they are allowed to see. Returns null if the account has no role. */
async function resolveUser(authUser){
 const uid=authUser.id;
 const [c,p,s]=await Promise.all([
  sb.from('coaches').select('id,full_name').eq('id',uid).maybeSingle(),
  sb.from('parents').select('id,full_name').eq('id',uid).maybeSingle(),
  sb.from('students').select('id,full_name').eq('user_id',uid).maybeSingle()
 ]);
 for(const r of [c,p,s]){if(r.error)throw r.error}
 let role=null,name='';
 if(c.data){role='coach';name=c.data.full_name}
 else if(p.data){role='parent';name=p.data.full_name}
 else if(s.data){role='student';name=s.data.full_name}
 if(!role)return null;
 const st=await sb.from('students').select('id,full_name').order('full_name');
 if(st.error)throw st.error;
 return {id:uid,role,name,students:st.data||[]};
}

/* Database rows -> the shapes the screens already use. */
const mapGoal=(r)=>({id:r.id,g:r.title,due:r.due_date||'',assigned:!r.is_personal,
 steps:(r.goal_steps||[]).slice()
  /* Order by saved position first; steps without one fall back to creation time, then ID, so every person sees the same order. */
  .sort((a,b)=>((a.position==null?1e9:a.position)-(b.position==null?1e9:b.position))||String(a.created_at).localeCompare(String(b.created_at))||String(a.id).localeCompare(String(b.id)))
  .map(s=>({id:s.id,t:s.title,done:s.done,pos:s.position==null?null:s.position}))});
const mapTask=(r)=>({id:r.id,t:r.title,type:r.type,date:r.due_date||'',daily:r.is_daily,core:r.is_core_goal,done:r.done,doneDates:r.done_dates||[]});
const mapLog=(r)=>({id:r.id,date:r.session_date,wins:r.wins||'',focus:r.next_focus||'',note:r.parent_note||'',toParent:r.show_to_parent,toStudent:r.show_to_student});

 <circle cx="32" cy="32" r="26.5" fill="none" stroke="#3B62FF" strokeWidth="1.2"/>
 <g stroke="#3B62FF" strokeWidth="1.8" strokeLinecap="round">
  <line x1="32" y1="8" x2="32" y2="12"/><line x1="19" y1="12" x2="21.5" y2="15.5"/><line x1="45" y1="12" x2="42.5" y2="15.5"/>
  <line x1="12" y1="22" x2="16" y2="23.5"/><line x1="52" y1="22" x2="48" y2="23.5"/>
 </g>
 <path d="M32 17c-3-3-9-2.5-11 1.5-3 .5-5 3.5-4 6.5-1.5 3 .5 6.500 3.500 7 .5 2 2.500 3.500 4.500 3.500h14c2 0 4-1.500 4.500-3.500 3-.5 5-4 3.500-7 1-3-1-6-4-6.500-2-4-8-4.500-11-1.500z" fill="#707070"/>
 <path d="M26 22c2 1 3 3 2 5m8-5c-2 1-3 3-2 5m-7 4c2 0 3 1 4 2m6-2c-2 0-3 1-4 2" stroke="#fff" strokeWidth="1.2" fill="none" strokeLinecap="round"/>
 <path d="M26 35h12v4c0 2-2 3-3 4v1.500h-6V43c-1-1-3-2-3-4z" fill="#707070"/>
 <rect x="27.500" y="46" width="9" height="2" rx="1" fill="#3B62FF"/><rect x="29" y="49.500" width="6" height="1.800" rx=".9" fill="#3B62FF"/>
</svg>);

const Card=({title,icon:Ic,children,action})=>(
<section className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
 <div className="flex items-center justify-between mb-4 gap-3 flex-wrap"><h3 className="flex items-center gap-2 font-bold text-slate-800">{Ic&&<Ic size={18} className="text-brand"/>}{title}</h3>{action}</div>
 {children}
</section>);

/* Dates are stored as ISO strings (YYYY-MM-DD) so the calendar can match them exactly. */
const pad=(n)=>String(n).padStart(2,'0');
const iso=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const parseISO=(s)=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dateToISO=(d)=>iso(d.getFullYear(),d.getMonth(),d.getDate());
const todayISO=()=>dateToISO(new Date());
const fmtShort=(s)=>parseISO(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});

/* Goal progress is never stored. It is always calculated from the goal's action steps. */
const goalStats=(g)=>{
 const total=g.steps.length;
 const done=g.steps.filter(s=>s.done).length;
 const pct=total?Math.round((done/total)*100):0;
 return {total,done,pct,achieved:total>0&&done===total};
};
/* New items get a unique ID right away so the screen can update instantly while the database saves. */
const newId=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16)}));

/* Homework, daily tasks and habits. Daily items (and all habits) reset every day: completion is stored per date in doneDates. */
const isDoneToday=(x,today)=>x.daily?x.doneDates.includes(today):x.done;
const streakOf=(x,today)=>{
 let n=0;const d=parseISO(today);
 if(!x.doneDates.includes(today))d.setDate(d.getDate()-1);
 while(x.doneDates.includes(dateToISO(d))){n++;d.setDate(d.getDate()-1)}
 return n;
};

 homework:{label:'Homework',plural:'Homework Assignments'},
 task:{label:'Daily Task',plural:'Daily Tasks'},
 habit:{label:'Habit',plural:'Habit Entries'}
};

 session:{label:'Session',Ic:Users},

const DoneBadge=()=>(<span className="pop inline-flex items-center gap-1 bg-green-500 text-white text-xs font-bold rounded-full px-2.5 py-1 shrink-0"><CheckCircle2 size={13}/>Done!</span>);

/* Password box with a Show / Hide button so people can check what they typed. */
function PasswordInput({id,label,value,onChange,autoComplete,placeholder,invalid}){
 const [show,setShow]=useState(false);
 return(<div>
  <label htmlFor={id} className="block text-sm font-semibold text-slate-700 mb-1">{label}</label>
  <div className="relative">
   <input id={id} type={show?'text':'password'} autoComplete={autoComplete} value={value} onChange={onChange} placeholder={placeholder} aria-invalid={invalid||undefined} className="w-full border border-slate-300 rounded-xl pl-3 pr-16 py-2 focus:border-brand"/>
   <button type="button" onClick={()=>setShow(!show)} aria-label={show?'Hide password':'Show password'} aria-pressed={show} className="absolute right-1.5 top-1/2 -translate-y-1/2 px-3 py-1.5 rounded-lg text-sm font-semibold text-brand hover:bg-brand/10">{show?'Hide':'Show'}</button>
  </div></div>);
}

/* Real sign-in with Supabase, plus "Forgot password?". onLogin(authUser) returns true when the account has a role, false when it does not. */
function Login({onLogin,notice,linkError}){
 const [mode,setMode]=useState('signin');
 const [email,setEmail]=useState('');
 const [password,setPassword]=useState('');
 const [error,setError]=useState(linkError?'That password reset link has expired or was already used. Please tap "Forgot password?" below to get a new one, and use the newest email only.':'');
 const [busy,setBusy]=useState(false);
 const [sent,setSent]=useState(false);
 const switchMode=(m)=>{setMode(m);setError('');setSent(false)};
 const submit=async(e)=>{
  e.preventDefault();
  if(!email.trim()||!password){setError('Enter your email and password.');return}
  setBusy(true);setError('');
  const {data,error:err}=await sb.auth.signInWithPassword({email:email.trim(),password});
  if(err){
   setBusy(false);
   setError(/invalid|credentials/i.test(err.message)?'That email or password is not correct. Tip: tap Show to check what you typed, or use "Forgot password?" below.':'We could not sign you in right now. Please try again in a moment.');
   return;
  }
  try{
   const ok=await onLogin(data.user);
   if(!ok){setBusy(false);setError('Account not recognized. Please contact your Skills 4Life Coach to set up your private access.')}
  }catch(ex){
   console.error(ex);setBusy(false);setError('We signed you in but could not load your account. Please try again in a moment.');
  }
 };
 /* Sends the reset email. The same message is shown whether or not the address has an account, so the screen never reveals who has one. */
 const sendReset=async(e)=>{
  e.preventDefault();
  if(!email.trim()){setError('Enter your email address first.');return}
  setBusy(true);setError('');
  const {error:err}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:window.location.origin+window.location.pathname});
  setBusy(false);
  if(err){
   console.error(err);
   setError(/rate|limit|seconds|too many/i.test(err.message)?'Please wait a minute before asking for another reset email.':'We could not send the email right now. Please try again in a moment, or contact your Skills 4Life Coach.');
   return;
  }
  setSent(true);
 };
 return(<div className="max-w-md mx-auto mt-6">
 <section className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
  <div className="flex flex-col items-center text-center mb-6">
   <Logo size={64}/>
   <h1 className="text-2xl font-extrabold text-slate-800 mt-3">{mode==='signin'?'Sign in':'Reset your password'}</h1>
   <p className="text-slate4 text-sm mt-1">{mode==='signin'?'Use the email address your coach set up for you.':'Enter your email and we will send you a link to choose a new password.'}</p>
  </div>
  {notice&&mode==='signin'&&<div role="status" className="flex gap-2 items-start bg-green-50 border border-green-200 text-green-800 rounded-xl p-3 text-sm mb-4"><CheckCircle2 size={18} className="shrink-0 mt-0.5"/><p>{notice}</p></div>}
  {mode==='signin'
   ?<form onSubmit={submit} noValidate className="space-y-4">
    <div><label htmlFor="login-email" className="block text-sm font-semibold text-slate-700 mb-1">Email</label>
     <input id="login-email" type="email" autoComplete="username" value={email} onChange={e=>{setEmail(e.target.value);setError('')}} placeholder="you@example.com" aria-invalid={!!error} aria-describedby={error?'login-error':undefined} className="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand"/></div>
    <PasswordInput id="login-password" label="Password" value={password} onChange={e=>setPassword(e.target.value)} autoComplete="current-password" placeholder="Enter your password"/>
    {error&&<div id="login-error" role="alert" className="flex gap-2 items-start bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 text-sm"><AlertCircle size={18} className="shrink-0 mt-0.5"/><p>{error}</p></div>}
    <button type="submit" disabled={busy} className="w-full bg-brand text-white font-semibold rounded-xl px-4 py-2.5 hover:bg-royal transition disabled:opacity-60">{busy?'Signing in…':'Sign in'}</button>
    <div className="text-center"><button type="button" onClick={()=>switchMode('forgot')} className="text-sm font-semibold text-brand hover:underline">Forgot password?</button></div>
   </form>
   :sent
    ?<div className="space-y-4">
     <div role="status" className="flex gap-2 items-start bg-green-50 border border-green-200 text-green-800 rounded-xl p-3 text-sm"><CheckCircle2 size={18} className="shrink-0 mt-0.5"/><p>If <span className="font-semibold">{email.trim()}</span> has an account, a password reset link is on its way. It can take a few minutes, and it may land in your spam folder.</p></div>
     <button type="button" onClick={()=>switchMode('signin')} className="w-full bg-brand text-white font-semibold rounded-xl px-4 py-2.5 hover:bg-royal transition">Back to sign in</button></div>
    :<form onSubmit={sendReset} noValidate className="space-y-4">
     <div><label htmlFor="reset-email" className="block text-sm font-semibold text-slate-700 mb-1">Email</label>
      <input id="reset-email" type="email" autoComplete="username" value={email} onChange={e=>{setEmail(e.target.value);setError('')}} placeholder="you@example.com" aria-invalid={!!error} className="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand"/></div>
     {error&&<div role="alert" className="flex gap-2 items-start bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 text-sm"><AlertCircle size={18} className="shrink-0 mt-0.5"/><p>{error}</p></div>}
     <button type="submit" disabled={busy} className="w-full bg-brand text-white font-semibold rounded-xl px-4 py-2.5 hover:bg-royal transition disabled:opacity-60">{busy?'Sending…':'Send reset link'}</button>
     <div className="text-center"><button type="button" onClick={()=>switchMode('signin')} className="text-sm font-semibold text-brand hover:underline">Back to sign in</button></div>
    </form>}
  <p className="mt-5 pt-4 border-t border-slate-100 text-xs text-slate4">Accounts are set up by your Skills 4Life Coach. Need access? Contact your coach.</p>
 </section></div>);
}

/* Shown after someone clicks the reset link in their email: choose a new password. */
function SetNewPassword({onDone}){
 const [pw,setPw]=useState('');
 const [pw2,setPw2]=useState('');
 const [error,setError]=useState('');
 const [busy,setBusy]=useState(false);
 const submit=async(e)=>{
  e.preventDefault();
  if(pw.length<8){setError('Your new password needs at least 8 characters.');return}
  if(pw!==pw2){setError('The two passwords do not match. Tap Show to check them.');return}
  setBusy(true);setError('');
  const {error:err}=await sb.auth.updateUser({password:pw});
  if(err){
   setBusy(false);
   setError(/different|same/i.test(err.message)?'Please choose a password you have not used before.':'We could not update your password. The link may have expired. Please go back and request a new one.');
   return;
  }
  await onDone();
 };
 return(<div className="max-w-md mx-auto mt-6">
 <section className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
  <div className="flex flex-col items-center text-center mb-6">
   <Logo size={64}/>
   <h1 className="text-2xl font-extrabold text-slate-800 mt-3">Choose a new password</h1>
   <p className="text-slate4 text-sm mt-1">Use at least 8 characters.</p>
  </div>
  <form onSubmit={submit} noValidate className="space-y-4">
   <PasswordInput id="new-password" label="New password" value={pw} onChange={e=>{setPw(e.target.value);setError('')}} autoComplete="new-password" placeholder="Enter a new password"/>
   <PasswordInput id="new-password2" label="Confirm new password" value={pw2} onChange={e=>{setPw2(e.target.value);setError('')}} autoComplete="new-password" placeholder="Type it again"/>
   {error&&<div role="alert" className="flex gap-2 items-start bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 text-sm"><AlertCircle size={18} className="shrink-0 mt-0.5"/><p>{error}</p></div>}
   <button type="submit" disabled={busy} className="w-full bg-brand text-white font-semibold rounded-xl px-4 py-2.5 hover:bg-royal transition disabled:opacity-60">{busy?'Saving…':'Save new password'}</button>
  </form>
 </section></div>);
}

/* Shared by student and parent views. The student passes sessions=[] so no session-log text appears there. Only the student passes tasks. */
function CalendarSection({goals,today,sessions,tasks=[]}){
 const [selectedDate,setSelectedDate]=useState(today);
 const [view,setView]=useState({y:parseISO(today).getFullYear(),m:parseISO(today).getMonth()});
 const taskEvents=(d)=>tasks.flatMap(x=>{
  if(x.daily){
   if(x.doneDates.includes(d))return [{k:x.type,t:x.t,n:x.type==='habit'?'Habit completed':'Daily task completed',done:true}];
   if(x.date===d)return [{k:x.type,t:x.t,n:'Starts today and repeats every day.',done:false}];
   return [];
  }
  if(x.date===d)return [{k:x.type,t:x.t,n:x.done?'Completed':'Due today',done:x.done}];
  return [];
 });
 const eventsFor=(d)=>[
  ...taskEvents(d),
  ...sessions.filter(x=>x.date===d).map(x=>({k:'log',t:'Session logged',n:x.wins.split('\n')[0]||x.focus})),
  ...goals.filter(g=>g.due===d).map(g=>{const s=goalStats(g);return {k:'goal',t:g.g,n:s.achieved?'Goal achieved! 🎉':`Progress: ${s.pct}% (${s.done} of ${s.total} action steps)`,done:s.achieved}})
 ];
 const items=eventsFor(selectedDate);
 const label=parseISO(selectedDate).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
 const monthLabel=new Date(view.y,view.m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
 const first=new Date(view.y,view.m,1).getDay();
 const days=new Date(view.y,view.m+1,0).getDate();
 const shift=(n)=>{const d=new Date(view.y,view.m+n,1);setView({y:d.getFullYear(),m:d.getMonth()})};
 const cells=[...Array(first).fill(null),...Array.from({length:days},(_,i)=>i+1)];
 return(<div className="lg:col-span-2 grid md:grid-cols-2 gap-5 print-hide-cal">
 <Card title={monthLabel} icon={CalendarDays} action={<div className="flex gap-1 items-center">
   <button type="button" onClick={()=>shift(-1)} aria-label="Previous month" className="w-9 h-9 rounded-lg bg-slate-100 text-brand text-xl font-bold leading-none hover:bg-brand/10">&lsaquo;</button>
   <button type="button" onClick={()=>{setView({y:parseISO(today).getFullYear(),m:parseISO(today).getMonth()});setSelectedDate(today)}} className="h-9 px-3 rounded-lg bg-slate-100 text-brand text-sm font-semibold hover:bg-brand/10">Today</button>
   <button type="button" onClick={()=>shift(1)} aria-label="Next month" className="w-9 h-9 rounded-lg bg-slate-100 text-brand text-xl font-bold leading-none hover:bg-brand/10">&rsaquo;</button></div>}>
  <div className="grid grid-cols-7 gap-1 text-center text-xs text-slate4 mb-1">{['S','M','T','W','T','F','S'].map((d,i)=><div key={i}>{d}</div>)}</div>
  <div className="grid grid-cols-7 gap-1">{cells.map((d,i)=>{
   if(!d)return <div key={'b'+i}/>;
   const key=iso(view.y,view.m,d);
   const sel=key===selectedDate,has=eventsFor(key).length>0,isToday=key===today;
   return(<button key={key} type="button" onClick={()=>setSelectedDate(key)} aria-pressed={sel}
    aria-label={parseISO(key).toLocaleDateString('en-US',{month:'long',day:'numeric'})+(has?', has items':'')+(isToday?', today':'')}
    className={'aspect-square rounded-full flex flex-col items-center justify-center text-sm transition cursor-pointer '+
     (sel?'bg-royal text-white font-bold shadow-md ring-2 ring-royal ring-offset-2':(has?'bg-brand/10 text-brand font-bold hover:bg-brand/20':'text-slate-600 hover:bg-slate-100'))+
     (!sel&&isToday?' ring-2 ring-brand':'')}>
    {d}{has&&<span className={'w-1.5 h-1.5 rounded-full mt-0.5 '+(sel?'bg-white':'bg-brand')}/>}
   </button>);})}</div>
  <p className="text-xs text-slate4 mt-3">Click a day to see what is scheduled. Dots mark days with items. Today has a thin outline.</p>
 </Card>
 <Card title="Schedule for Selected Date" icon={ListChecks}>
  <div aria-live="polite">
   <p className="font-bold text-royal mb-3">{label}{selectedDate===today&&<span className="ml-2 text-xs font-semibold text-slate4">Today</span>}</p>
   {items.length===0
    ?<div className="text-center py-10 text-slate4"><CalendarDays className="mx-auto mb-2" size={28}/><p>No sessions or goals scheduled for this day.</p></div>
    :<ul className="space-y-3">{items.map((it,i)=>{const M=kindMeta[it.k];return(
      <li key={i} className={'flex gap-3 p-3 rounded-xl border '+(it.done?'border-green-200 bg-green-50':'border-slate-200 bg-slate-50')}>
       <M.Ic size={20} className={(it.done?'text-green-600':'text-brand')+' mt-0.5 shrink-0'}/>

/* Student form: create a personal goal with dynamic action steps (add as many as needed, one at a time). */

/* ---------- Weekly summary for parents: completion and streaks over a 7-day window ---------- */
const lastNDays=(end,n)=>Array.from({length:n},(_,i)=>{const d=parseISO(end);d.setDate(d.getDate()-(n-1-i));return dateToISO(d)});
/* Longest run of consecutive completed days, ever, for a daily task or habit. */
const bestStreak=(x)=>{
 const ds=[...new Set(x.doneDates)].sort();let best=0,run=0,prev=null;
 for(const d of ds){
  if(prev){const n=parseISO(prev);n.setDate(n.getDate()+1);run=dateToISO(n)===d?run+1:1}else run=1;
  best=Math.max(best,run);prev=d;
 }
 return best;
};

function WeeklySummary({tasks,today}){
 const [offset,setOffset]=useState(0);
 const endD=parseISO(today);endD.setDate(endD.getDate()-7*offset);
 const end=dateToISO(endD);
 const days=lastNDays(end,7);
 const start=days[0];
 const recurring=tasks.filter(x=>x.daily);
 /* One day's state for a daily task or habit. Today (or later) that is not checked yet is "pending", so it never counts against the student. */
 const cell=(x,d)=>{
  if(x.doneDates.includes(d))return 'done';
  if(x.date&&d<x.date)return 'na';
  if(d>=today)return 'pending';
  return 'missed';
 };
 const rows=recurring.map(x=>{
  const cs=days.map(d=>cell(x,d));
  const done=cs.filter(c=>c==='done').length;
  const exp=done+cs.filter(c=>c==='missed').length;
  return {x,cs,done,exp,streak:streakOf(x,end),best:bestStreak(x)};
 }).filter(r=>r.cs.some(c=>c!=='na'));
 /* Homework and one-time tasks count in the week they are due. Upcoming items (not yet due) are listed but not counted. */
 const oneTime=tasks.filter(x=>!x.daily&&x.date&&x.date>=start&&x.date<=end)
  .slice().sort((a,b)=>a.date.localeCompare(b.date));
 const status=(x)=>x.done?'done':(x.date<today?'overdue':'upcoming');
 const rDone=rows.reduce((n,r)=>n+r.done,0),rExp=rows.reduce((n,r)=>n+r.exp,0);
 const oDone=oneTime.filter(x=>status(x)==='done').length;
 const oDue=oneTime.filter(x=>status(x)!=='upcoming').length;
 const totalDone=rDone+oDone,totalExp=rExp+oDue;
 const pct=totalExp?Math.round((totalDone/totalExp)*100):null;
 const topStreak=rows.reduce((m,r)=>Math.max(m,r.streak),0);
 const rangeLabel=`${fmtShort(start)} to ${fmtShort(end)}`;
 const note=pct===null?'Nothing was scheduled for this week yet.'
  :pct>=80?'A strong week. Consistency like this is what builds executive function skills.'
  :pct>=50?'Solid progress this week. A little more consistency will keep momentum building.'
  :'A lighter week. Small, steady steps are the goal, so ask your coach about what to focus on next.';
 const tile=(label,value,sub)=>(<div className="rounded-xl border border-slate-200 bg-slate-50 p-3 text-center">
  <p className="text-2xl font-extrabold text-royal">{value}</p><p className="text-xs font-semibold text-slate-700">{label}</p>{sub&&<p className="text-xs text-slate4 mt-0.5">{sub}</p>}</div>);
 const mark=(c)=>c==='done'?<CheckCircle2 className="text-green-500" size={24} aria-label="Done"/>
  :c==='missed'?<Circle className="text-red-300" size={24} aria-label="Missed"/>
  :c==='pending'?<Circle className="text-slate-300" size={24} aria-label="Not yet"/>
  :<span className="text-slate-300 text-lg leading-none" aria-label="Not started">–</span>;
 const cols={gridTemplateColumns:'minmax(8rem,1fr) repeat(7,2.25rem) 3.5rem'};
 return(<Card title="Weekly Summary" icon={Flame} action={<div className="no-print flex gap-1 items-center">
   <button type="button" onClick={()=>setOffset(offset+1)} aria-label="Previous week" className="w-9 h-9 rounded-lg bg-slate-100 text-brand text-xl font-bold leading-none hover:bg-brand/10">&lsaquo;</button>
   <button type="button" onClick={()=>setOffset(0)} disabled={offset===0} className="h-9 px-3 rounded-lg bg-slate-100 text-brand text-sm font-semibold hover:bg-brand/10 disabled:opacity-50">This week</button>
   <button type="button" onClick={()=>setOffset(Math.max(0,offset-1))} disabled={offset===0} aria-label="Next week" className="w-9 h-9 rounded-lg bg-slate-100 text-brand text-xl font-bold leading-none hover:bg-brand/10 disabled:opacity-50">&rsaquo;</button></div>}>
  <p className="font-bold text-royal mb-3">{rangeLabel}{offset===0&&<span className="ml-2 text-xs font-semibold text-slate4">Last 7 days</span>}</p>
  {tasks.length===0
   ?<p className="text-sm text-slate4">No homework, tasks or habits have been added yet. Once your student starts using their Task List, the weekly summary will appear here.</p>
   :<div className="space-y-5">
    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
     {tile('Completion',pct===null?'–':pct+'%',totalExp?`${totalDone} of ${totalExp} done`:'')}
     {tile('Daily check-ins',rExp?`${rDone}/${rExp}`:'–','Daily tasks & habits')}
     {tile('Homework & tasks',oDue?`${oDone}/${oDue}`:'–','Due this week')}
     {tile('Current streak',topStreak>0?topStreak+(topStreak===1?' day':' days'):'–','Longest running habit')}
    </div>
    <p className="text-sm text-slate-700 bg-brand/5 rounded-xl p-3">{note}</p>
    {rows.length>0&&<div>
     <h4 className="font-bold text-slate-800 mb-2">Daily tasks &amp; habits</h4>
     <div className="overflow-x-auto"><div className="min-w-[540px]">
      <div className="grid gap-1 items-center text-xs text-slate4 mb-1" style={cols}>
       <span/>{days.map(d=><span key={d} className={'text-center font-semibold '+(d===today?'text-royal':'')}>{parseISO(d).toLocaleDateString('en-US',{weekday:'short'})}</span>)}<span className="text-center font-semibold">Total</span></div>
      <ul className="space-y-1">{rows.map(r=>{const M=kindMeta[r.x.type];return(
       <li key={r.x.id} className="grid gap-1 items-center p-1.5 rounded-xl border border-slate-200 bg-white" style={cols}>
        <span className="min-w-0"><span className="block font-semibold text-slate-800 truncate">{r.x.t}</span>
         <span className="flex flex-wrap items-center gap-x-2 text-xs text-slate4"><span className="inline-flex items-center gap-1 font-semibold text-brand"><M.Ic size={11}/>{typeMeta[r.x.type].label}</span>
          {r.streak>0&&<span className="inline-flex items-center gap-1 font-semibold text-orange-600"><Flame size={11}/>{r.streak}-day streak</span>}
          {r.best>1&&<span>Best: {r.best}</span>}</span></span>

        <span className="text-center text-sm font-bold text-slate-700">{r.done}/{r.exp}</span>
       </li>);})}</ul>
     </div></div>
     <p className="text-xs text-slate4 mt-2">Green means done. Pink means missed. Gray means not checked yet. A dash means the item had not started yet.</p>
    </div>}
    {oneTime.length>0&&<div>
     <h4 className="font-bold text-slate-800 mb-2">Homework &amp; tasks due this week</h4>
     <ul className="space-y-1.5">{oneTime.map(x=>{const st=status(x);const M=kindMeta[x.type];return(
      <li key={x.id} className={'flex items-center gap-3 p-2.5 rounded-xl border '+(st==='done'?'bg-green-50 border-green-200':st==='overdue'?'bg-red-50 border-red-200':'bg-white border-slate-200')}>

/* Coach panel: build a goal with a title, due date, and any number of action steps, then save it to the selected student. */
function GoalAssigner({onAssign,goals,studentName}){
 const [title,setTitle]=useState('');
 const [due,setDue]=useState('');
 const [stepText,setStepText]=useState('');
 const [steps,setSteps]=useState([]);
 const [msg,setMsg]=useState('');
 const [err,setErr]=useState('');
 const clear=()=>{setMsg('');setErr('')};
 const addStep=()=>{const t=stepText.trim();if(!t)return;setSteps(s=>[...s,{id:newId(),t}]);setStepText('');clear()};
 const removeStep=(id)=>{setSteps(s=>s.filter(x=>x.id!==id));clear()};
 const submit=(e)=>{
  e.preventDefault();
  if(!title.trim()){setErr('Enter a goal title, like "Master Semester Study Schedule".');setMsg('');return}
  const all=[...steps.map(s=>s.t),...(stepText.trim()?[stepText.trim()]:[])];
  if(all.length===0){setErr('Add at least one action step so the student has a progress bar to fill.');setMsg('');return}
  onAssign({title:title.trim(),due,steps:all});
  setMsg(`Assigned "${title.trim()}" with ${all.length} action step${all.length===1?'':'s'}. ${studentName||'The student'} will see it in My Core Goals.`);
  setErr('');setTitle('');setDue('');setStepText('');setSteps([]);
 };
 const inp="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand bg-white";

     <input value={title} onChange={e=>{setTitle(e.target.value);clear()}} placeholder="e.g., Master Semester Study Schedule" aria-invalid={!!err&&!title.trim()} className={inp}/></label>

     <input value={stepText} onChange={e=>{setStepText(e.target.value);clear()}} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addStep()}}} aria-label="New action step" placeholder="Type a step and press Enter or Add Step" className={inp}/>
     <button type="button" onClick={addStep} className="flex items-center gap-1 bg-slate-100 text-brand font-semibold rounded-xl px-4 py-2 hover:bg-brand/10 transition shrink-0"><Plus size={16}/>Add Step</button>
    </div>

     <span className="font-bold text-brand w-5">{i+1}.</span><span className="flex-1 text-slate-800">{s.t}</span>
     <button type="button" onClick={()=>removeStep(s.id)} aria-label={'Remove step: '+s.t} className="p-1 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50"><X size={14}/></button></li>))}</ol>}
    <p className="text-xs text-slate4 mt-2">The student’s progress bar is calculated from these steps as they check them off.</p>
   </div>
   <div className="flex flex-wrap items-center gap-3">
    <button type="submit" className="flex items-center gap-2 bg-brand text-white font-semibold rounded-xl px-4 py-2 hover:bg-royal transition"><Send size={16}/>Assign Goal to Student</button>
    <span aria-live="polite" className="text-sm">{err?<span role="alert" className="text-red-700">{err}</span>:<span className="text-green-700 font-medium">{msg}</span>}</span>
   </div>
  </form>
  <div className="mt-5 pt-4 border-t border-slate-100">
   <h4 className="text-sm font-bold text-slate-800 mb-2">Student’s Current Goals</h4>
   {goals.length===0?<p className="text-sm text-slate4">No goals yet.</p>

    <div className="h-2 bg-slate-100 rounded-full overflow-hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={s.pct} aria-label={'Progress for '+g.g}><div className={'h-full rounded-full transition-all '+(s.achieved?'bg-green-500':'bg-brand')} style={{width:s.pct+'%'}}/></div>
    <p className="text-xs text-slate4 mt-1">{s.done} of {s.total} action steps done{g.due?' · Due '+fmtShort(g.due):''}</p>
    {g.steps.length>0&&<ul className="mt-2 space-y-1">{g.steps.map((st,i)=>(<li key={st.id} className={'flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm '+(st.done?'bg-green-50':'bg-slate-50')}>
     <span aria-hidden="true" className={'font-bold w-4 text-center shrink-0 '+(st.done?'text-green-600':'text-slate-400')}>{st.done?'✓':'○'}</span>
     <span className={st.done?'line-through text-slate-400':'text-slate-800'}><span className="font-semibold text-slate4 mr-1">{i+1}.</span>{st.t}</span>
     <span className="sr-only">{st.done?'(done)':'(not done)'}</span></li>))}</ul>}</li>);})}</ul>}
  </div>
 </Card>);
}

function Coach({report,setReport,saveSession,sessions,goals,assignGoal,studentName,tasks,today,addTask,removeTask}){
 const [msg,setMsg]=useState('');
 const [err,setErr]=useState('');
 const [saving,setSaving]=useState(false);
 const set=(k,v)=>{setReport({...report,[k]:v});setMsg('');setErr('')};
 /* Called as a function, not used as a component, so typing keeps focus in the text boxes. */

  <textarea rows={rows} value={report[k]} onChange={e=>set(k,e.target.value)} placeholder={ph} className="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand"/></label>);

  if(!report.wins.trim()&&!report.focus.trim()){setErr('Add a win or a focus before saving.');return}
  const who=[report.toParent&&'parent',report.toStudent&&'student'].filter(Boolean).join(' and ');
  setSaving(true);
  const ok=await saveSession();
  setSaving(false);
  if(ok){setMsg('Session log saved. Visible to: '+(who||'coach only')+'.');setErr('')}
  else{setErr('The session log could not be saved. Please try again.');setMsg('')}
 };
 const badge=(x)=>[x.toParent&&'Parent',x.toStudent&&'Student'].filter(Boolean);
 return(<div className="grid lg:grid-cols-3 gap-5">
 <div className="lg:col-span-2"><Card title="Session Notes" icon={ClipboardList}><div className="space-y-4">

  {field('Wins this session','wins','What went well? One win per line.')}
  {field('Focus for next time','focus','What will we work on next?')}
  {field('Note for parents (optional)','note','Anything parents can support at home?',3)}

   <span aria-live="polite" className="text-sm">{err?<span role="alert" className="text-red-700">{err}</span>:<span className="text-green-700 font-medium">{msg}</span>}</span></div>
 </div></Card></div>
 <div className="space-y-5">
 <Card title="Who Can See This Log" icon={Eye}>
  <div className="space-y-4">
   <Switch on={report.toParent} toggle={()=>set('toParent',!report.toParent)} label={report.toParent?'Shown to parent':'Hidden from parent'} hint="Latest update, session log, wins tracker, printable report"/>
   <Switch on={report.toStudent} toggle={()=>set('toStudent',!report.toStudent)} label={report.toStudent?'Shown to student':'Hidden from student'} hint="Kept on record; the student dashboard no longer displays session logs"/>
  </div>
 </Card>
 <Card title="Saved Logs" icon={ClipboardList}>
  {sessions.length===0?<p className="text-sm text-slate4">No session logs saved yet.</p>
  :<div className="divide-y divide-slate-100">{sessions.map(x=>(<div key={x.id} className="py-2.5"><div className="flex items-center justify-between gap-2"><span className="font-bold text-brand">{fmtShort(x.date)}</span>
   <span className="flex gap-1 flex-wrap justify-end">{(badge(x).length?badge(x):['Coach only']).map(b=><span key={b} className="text-xs font-semibold bg-brand/10 text-brand rounded-full px-2 py-0.5">{b}</span>)}</span></div>
   <p className="text-sm text-slate-700 mt-1">{x.wins.split('\n')[0]||x.focus}</p></div>))}</div>}
 </Card></div>
 <div className="lg:col-span-3"><GoalAssigner onAssign={assignGoal} goals={goals} studentName={studentName}/></div>
 <div className="lg:col-span-3"><CoachTaskList tasks={tasks} today={today} studentName={studentName} removeTask={removeTask}/></div>

function App(){
 /* The role comes only from the database lookup at sign-in; it cannot be changed from the UI afterward. */
 const [user,setUser]=useState(null);
 const [booting,setBooting]=useState(true);
 const [activeId,setActiveId]=useState(null);
 const [loading,setLoading]=useState(false);
 const [dbError,setDbError]=useState('');
 const [recovering,setRecovering]=useState(RECOVERY_LINK);
 const [notice,setNotice]=useState('');
 const role=user?user.role:null;
 const students=user?user.students:[];
 const activeStudent=students.find(s=>s.id===activeId)||null;
 /* The coach's draft; saving turns it into a saved session log, with its own parent/student visibility. */
 const blank=()=>({date:todayISO(),wins:'',focus:'',note:'',toParent:true,toStudent:true});
 const [report,setReport]=useState(blank());
 const [sessions,setSessions]=useState([]);
 const [goals,setGoals]=useState([]);
 const [tasks,setTasks]=useState([]);
 const [today,setToday]=useState(todayISO());
 useEffect(()=>{const id=setInterval(()=>setToday(todayISO()),60000);return()=>clearInterval(id)},[]);

 /* Keep people signed in after a page refresh, and react to sign-out. */
 useEffect(()=>{
  let alive=true;
  (async()=>{
   try{
    const {data}=await sb.auth.getSession();
    if(data&&data.session&&!RECOVERY_LINK){
     const u=await resolveUser(data.session.user);
     if(alive){if(u)setUser(u);else await sb.auth.signOut()}
    }
   }catch(ex){console.error(ex)}
   if(alive)setBooting(false);
  })();
  const {data:sub}=sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')setUser(null);if(ev==='PASSWORD_RECOVERY'){setUser(null);setRecovering(true)}});
  return()=>{alive=false;sub.subscription.unsubscribe()};
 },[]);

 /* After a new password is saved: sign out, tidy the address bar, and send the person to the sign-in screen with a confirmation. */
 const finishRecovery=async()=>{
  await sb.auth.signOut();
  window.history.replaceState(null,'',window.location.pathname+window.location.search);
  setRecovering(false);setUser(null);setNotice('Your password was updated. Please sign in with your new password.');
 };
 const handleLogin=async(authUser)=>{
  const u=await resolveUser(authUser);
  if(!u){await sb.auth.signOut();return false}
  setDbError('');setUser(u);return true;
 };
 const signOut=async()=>{
  await sb.auth.signOut();
  setUser(null);setDbError('');setGoals([]);setTasks([]);setSessions([]);setReport(blank());
 };

 /* Pick the first student whenever someone signs in. */
 useEffect(()=>{setActiveId(user&&user.students[0]?user.students[0].id:null)},[user]);

 /* Load the selected student's goals, tasks, and session logs. The database's privacy rules decide what comes back. */
 const loadData=async(sid,stillCurrent=()=>true)=>{
  const [g,t,s]=await Promise.all([
   sb.from('goals').select('*, goal_steps(*)').eq('student_id',sid).order('created_at'),
   sb.from('tasks').select('*').eq('student_id',sid).order('created_at'),
   sb.from('session_logs').select('*').eq('student_id',sid).order('session_date',{ascending:false}).order('created_at',{ascending:false})
  ]);
  if(!stillCurrent())return;
  if(g.error||t.error||s.error){console.error(g.error||t.error||s.error);setDbError('We could not load the latest information. Please refresh the page or try again in a moment.');return}
  setGoals(g.data.map(mapGoal));setTasks(t.data.map(mapTask));setSessions(s.data.map(mapLog));
 };
 useEffect(()=>{
  if(!user||!activeId){setGoals([]);setTasks([]);setSessions([]);return}
  let alive=true;
  setLoading(true);
  loadData(activeId,()=>alive).finally(()=>{if(alive)setLoading(false)});
  return()=>{alive=false};
 },[user,activeId]);

 /* If a save fails, tell the person and reload from the database so the screen matches what was really saved. */
 const failed=(err)=>{
  console.error(err);
  setDbError('That change could not be saved, so the screen was refreshed. Please try again, and tell your coach if it keeps happening.');
  if(activeId)loadData(activeId);
 };
 const check=({error})=>{if(error)failed(error)};

 /* Goal action steps: progress is derived from these, so there is no manual progress value. */
 const toggleStep=(gid,sid)=>{
  const goal=goals.find(g=>g.id===gid);const step=goal&&goal.steps.find(s=>s.id===sid);
  if(!step)return;
  const done=!step.done;
  setGoals(gs=>gs.map(g=>g.id!==gid?g:{...g,steps:g.steps.map(s=>s.id===sid?{...s,done}:s)}));
  sb.from('goal_steps').update({done}).eq('id',sid).then(check);
 };
 const addStep=(gid,t)=>{
  const id=newId();
  const goal=goals.find(g=>g.id===gid);
  const pos=goal?goal.steps.reduce((m,x)=>Math.max(m,x.pos==null?-1:x.pos),-1)+1:0;
  setGoals(gs=>gs.map(g=>g.id!==gid?g:{...g,steps:[...g.steps,{id,t,done:false,pos}]}));
  sb.from('goal_steps').insert({id,goal_id:gid,student_id:activeId,title:t,done:false,position:pos}).then(check);
 };
 const removeStep=(gid,sid)=>{
  setGoals(gs=>gs.map(g=>g.id!==gid?g:{...g,steps:g.steps.filter(s=>s.id!==sid)}));
  sb.from('goal_steps').delete().eq('id',sid).then(check);
 };
 /* A student's own goal (is_personal) or a coach-assigned goal. Both live in the same table the student, parent, and calendar read. */
 const saveGoal=async({title,due,steps},personal)=>{
  const gid=newId();
  const stepRows=steps.map((t,i)=>({id:newId(),t,done:false,pos:i}));
  setGoals(g=>[...g,{id:gid,g:title,due,assigned:!personal,steps:stepRows}]);
  let r=await sb.from('goals').insert({id:gid,student_id:activeId,title,due_date:due||null,is_personal:personal});
  if(!r.error&&stepRows.length){
   r=await sb.from('goal_steps').insert(stepRows.map(s=>({id:s.id,goal_id:gid,student_id:activeId,title:s.t,done:false,position:s.pos})));
  }
  if(r.error)failed(r.error);
 };
 const addGoal=(x)=>saveGoal(x,true);
 const assignGoal=(x)=>saveGoal(x,false);

 /* Homework, daily tasks and habits. Daily items store completion per date, so they reset automatically each day.
    The same addTask and removeTask are used by the student and by the coach (for the selected student). */
 const addTask=({t,type,date,daily,core})=>{
  const id=newId();
  setTasks(x=>[...x,{id,t,type,date,daily,core,done:false,doneDates:[]}]);
  sb.from('tasks').insert({id,student_id:activeId,title:t,type,due_date:date||null,is_daily:daily,is_core_goal:core,done:false,done_dates:[]}).then(check);
 };
 const toggleTask=(id)=>{
  const x=tasks.find(y=>y.id===id);if(!x)return;
  let next,patch;
  if(x.daily){
   const dd=x.doneDates.includes(today)?x.doneDates.filter(d=>d!==today):[...x.doneDates,today];
   next={...x,doneDates:dd};patch={done_dates:dd};
  }else{
   next={...x,done:!x.done};patch={done:!x.done};
  }
  setTasks(xs=>xs.map(y=>y.id===id?next:y));
  sb.from('tasks').update(patch).eq('id',id).then(check);
 };
 const removeTask=(id)=>{
  setTasks(xs=>xs.filter(x=>x.id!==id));
  sb.from('tasks').delete().eq('id',id).then(check);
 };

 /* Saves the coach's session log to the selected student. Returns true or false so the form can show the right message. */
 const saveSession=async()=>{
  if(!activeId)return false;
  const e={id:newId(),date:report.date,wins:report.wins.trim(),focus:report.focus.trim(),note:report.note.trim(),toParent:report.toParent,toStudent:report.toStudent};
  const {error}=await sb.from('session_logs').insert({id:e.id,student_id:activeId,session_date:e.date,wins:e.wins,next_focus:e.focus,parent_note:e.note,show_to_parent:e.toParent,show_to_student:e.toStudent});
  if(error){console.error(error);return false}
  setSessions(x=>[e,...x].sort((a,b)=>b.date.localeCompare(a.date)));
  setReport({...blank(),date:report.date,toParent:report.toParent,toStudent:report.toStudent});
  return true;
 };

 /* The parent's Wins Tracker is built from the wins in the session logs the coach shared with the parent. */
 const wins=sessions.filter(x=>x.toParent).flatMap(x=>x.wins.split('\n').map(t=>t.trim()).filter(Boolean).map(t=>({t,d:fmtShort(x.date)})));

 const emptyMsg=role==='parent'?'No child is linked to your account yet. Please contact your Skills 4Life Coach.':'No students are assigned to this account yet.';
 return(<div className="min-h-screen">
  <header className="bg-white border-b border-slate-200 sticky top-0 z-10">
   <div className="max-w-6xl mx-auto px-5 py-3 flex flex-wrap items-center justify-between gap-3">
    <div className="flex items-center gap-3"><Logo/><div className="leading-tight"><div className="text-xl font-extrabold text-brand tracking-tight">Skills 4Life</div><div className="text-xs font-semibold text-slate4 tracking-[0.25em]">COACHING</div></div></div>
    {user&&<div className="no-print flex items-center gap-3">
     <span className="text-sm text-slate4 hidden sm:inline">{user.name}</span>
     <button onClick={signOut} className="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 text-slate4 hover:text-slate-900 transition"><LogOut size={16}/>Sign out</button></div>}
   </div></header>
  <main className="max-w-6xl mx-auto px-5 py-8">
   {booting&&<p className="text-center text-slate4 mt-10" aria-live="polite">Loading…</p>}
   {!booting&&recovering&&<SetNewPassword onDone={finishRecovery}/>}
   {!booting&&!recovering&&!user&&<Login onLogin={handleLogin} notice={notice} linkError={LINK_ERROR}/>}
   {!booting&&!recovering&&user&&<>
    <h1 className="text-2xl font-extrabold text-slate-800 mb-1">{role==='student'?'Student Dashboard':role==='parent'?'Parent Portal':'Coach Dashboard'}</h1>
    <p className="text-slate4 mb-6">{role==='student'?'Your goals, homework, daily tasks, habits, and calendar.':role==='parent'?'Weekly summary, progress, session updates, and wins.':'Log the session, assign goals and tasks, and choose what parents can see.'}</p>
    {dbError&&<div role="alert" className="no-print flex gap-2 items-start bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 text-sm mb-5"><AlertCircle size={18} className="shrink-0 mt-0.5"/><p className="flex-1">{dbError}</p>
     <button type="button" onClick={()=>setDbError('')} aria-label="Dismiss message" className="p-0.5 rounded hover:bg-red-100"><X size={14}/></button></div>}
    {role!=='student'&&<StudentPicker students={students} activeId={activeId} setActiveId={setActiveId} label={role==='parent'?'Child:':'Student:'}/>}
    {students.length===0
     ?<p className="text-slate4 bg-white border border-slate-200 rounded-2xl p-6 text-center">{emptyMsg}</p>
     :loading
      ?<p className="text-center text-slate4 mt-10" aria-live="polite">Loading…</p>
      :<>
       {role==='student'&&<Student goals={goals} toggleStep={toggleStep} addStep={addStep} removeStep={removeStep} addGoal={addGoal} tasks={tasks} addTask={addTask} toggleTask={toggleTask} removeTask={removeTask} today={today}/>}
       {role==='parent'&&<Parent sessions={sessions.filter(x=>x.toParent)} wins={wins} goals={goals} tasks={tasks} today={today} childName={activeStudent?activeStudent.full_name:''}/>}
       {role==='coach'&&<Coach report={report} setReport={setReport} saveSession={saveSession} sessions={sessions} goals={goals} assignGoal={assignGoal} studentName={activeStudent?activeStudent.full_name:''} tasks={tasks} today={today} addTask={addTask} removeTask={removeTask}/>}
      </>}
   </>}
  </main>
  <footer className="text-center text-xs text-slate4 pb-8">Skills 4Life Coaching · Executive function skills for life</footer>
 </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

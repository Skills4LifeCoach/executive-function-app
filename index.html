<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steady Steps – Executive Function Coaching</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['"Atkinson Hyperlegible"', 'system-ui', 'sans-serif'] },
  colors: { ink:'#1F2D45', sea:'#1E7F86', sea50:'#E6F4F4', sun:'#F4B942', sun50:'#FDF1D6', leaf:'#3F8F5E', leaf50:'#E4F3EA', mist:'#F3F6F9', coral:'#C9593F' }
}}};
</script>
<style>
  body { background:#F3F6F9; color:#1F2D45; }
  :focus-visible { outline:3px solid #1E7F86; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

/* ---------- shared pieces ---------- */
const Card = ({ children, className = '' }) => (
  <section className={'bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 ' + className}>{children}</section>
);
const H = ({ children, sub }) => (
  <div className="mb-4">
    <h2 className="text-xl font-bold">{children}</h2>
    {sub && <p className="text-slate-600 mt-1">{sub}</p>}
  </div>
);
const Btn = ({ children, kind = 'p', className = '', ...r }) => (
  <button {...r} className={'rounded-xl px-5 py-3 font-bold transition-colors ' + (kind === 'p'
    ? 'bg-sea text-white hover:bg-teal-800' : 'bg-white border-2 border-slate-300 hover:border-sea') + ' ' + className}>{children}</button>
);
const Tabs = ({ items, value, onChange }) => (
  <div role="tablist" className="flex flex-wrap gap-2 mb-6">
    {items.map(([k, label]) => (
      <button key={k} role="tab" aria-selected={value === k} onClick={() => onChange(k)}
        className={'px-5 py-3 rounded-xl font-bold border-2 transition-colors ' + (value === k
          ? 'bg-ink text-white border-ink' : 'bg-white border-slate-200 hover:border-ink')}>{label}</button>
    ))}
  </div>
);
const Check = ({ done, onClick, children }) => (
  <button role="checkbox" aria-checked={done} onClick={onClick}
    className={'w-full flex items-center gap-4 text-left rounded-xl border-2 p-4 transition-colors ' + (done
      ? 'bg-leaf50 border-leaf50' : 'bg-white border-slate-200 hover:border-sea')}>
    <span className={'flex-none w-8 h-8 rounded-full border-2 grid place-items-center text-white font-bold ' + (done ? 'bg-leaf border-leaf' : 'border-slate-400')}>{done ? '✓' : ''}</span>
    <span className={'text-lg ' + (done ? 'line-through text-slate-500' : '')}>{children}</span>
  </button>
);
const AddRow = ({ ph, onAdd }) => {
  const [v, setV] = useState('');
  const go = e => { e.preventDefault(); if (v.trim()) { onAdd(v.trim()); setV(''); } };
  return (
    <form onSubmit={go} className="flex gap-2 mt-4">
      <input aria-label={ph} value={v} onChange={e => setV(e.target.value)} placeholder={ph}
        className="flex-1 min-w-0 rounded-xl border-2 border-slate-300 px-4 py-3 text-lg" />
      <Btn type="submit">Add</Btn>
    </form>
  );
};
const Bar = ({ v, color = 'bg-sea' }) => (
  <div className="h-4 rounded-full bg-slate-200" role="progressbar" aria-valuenow={v} aria-valuemin="0" aria-valuemax="100">
    <div className={'h-4 rounded-full transition-all ' + color} style={{ width: v + '%' }} />
  </div>
);
const flip = (list, id, key = 'd') => list.map(x => x.id === id ? { ...x, [key]: !x[key] } : x);

/* ---------- STUDENT ---------- */
function Today({ s }) {
  const { tasks, setTasks } = s;
  const [focus, setFocus] = useState(false);
  const done = tasks.filter(t => t.d).length;
  const pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
  const next = tasks.find(t => !t.d);
  const later = id => { const t = tasks.find(x => x.id === id); setTasks([...tasks.filter(x => x.id !== id), t]); };
  return (
    <Card>
      <H sub={done + ' of ' + tasks.length + ' done'}>Today’s tasks</H>
      <Bar v={pct} color="bg-leaf" />
      <label className="flex items-center gap-3 mt-4 text-lg cursor-pointer">
        <input type="checkbox" className="w-6 h-6 accent-teal-700" checked={focus} onChange={e => setFocus(e.target.checked)} />
        Show one task at a time
      </label>
      <div className="mt-4 space-y-3">
        {focus ? (next ? (
          <div className="rounded-2xl bg-sun50 p-6 text-center">
            <p className="text-slate-600">Your next step</p>
            <p className="text-2xl font-bold my-3">{next.t}</p>
            <div className="flex justify-center gap-3">
              <Btn onClick={() => setTasks(flip(tasks, next.id))}>I did it</Btn>
              <Btn kind="s" onClick={() => later(next.id)}>Do this later</Btn>
            </div>
          </div>
        ) : <p className="rounded-2xl bg-leaf50 p-6 text-xl font-bold text-center">All done. Take a break you chose yourself.</p>)
          : tasks.map(t => <Check key={t.id} done={t.d} onClick={() => setTasks(flip(tasks, t.id))}>{t.t} <span className="text-slate-500 text-base">· {t.s}</span></Check>)}
      </div>
      <AddRow ph="Add a task" onAdd={t => setTasks([...tasks, { id: Date.now(), t, s: 'Mine', d: false }])} />
    </Card>
  );
}
function Planner({ s }) {
  const { blocks, setBlocks } = s;
  const [time, setTime] = useState('7:00 PM');
  return (
    <Card>
      <H sub="Monday, November 2. Plan breaks too.">Today’s plan</H>
      <div className="space-y-3">
        {blocks.map(b => (
          <div key={b.id} className="flex items-stretch gap-3">
            <div className="w-24 flex-none rounded-xl bg-sea50 grid place-items-center font-bold text-sea text-center p-2">{b.time}</div>
            <div className="flex-1"><Check done={b.d} onClick={() => setBlocks(flip(blocks, b.id))}>{b.t}</Check></div>
          </div>
        ))}
      </div>
      <div className="mt-4 flex gap-2 items-center">
        <label className="font-bold" htmlFor="tm">Start</label>
        <input id="tm" value={time} onChange={e => setTime(e.target.value)} className="w-28 rounded-xl border-2 border-slate-300 px-3 py-3" />
      </div>
      <AddRow ph="What will you do then?" onAdd={t => setBlocks([...blocks, { id: Date.now(), time, t, d: false }])} />
    </Card>
  );
}
function Calendar({ s }) {
  const { events, setEvents } = s;
  const [sel, setSel] = useState(2);
  const cells = Array.from({ length: 30 }, (_, i) => i + 1); // Nov 2026 starts on a Sunday
  return (
    <Card>
      <H>November 2026</H>
      <div className="grid grid-cols-7 gap-1 sm:gap-2 text-center">
        {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => <div key={d} className="font-bold text-slate-500 py-1">{d}</div>)}
        {cells.map(d => (
          <button key={d} onClick={() => setSel(d)} aria-label={'November ' + d}
            className={'aspect-square rounded-xl border-2 flex flex-col items-center justify-center transition-colors ' +
              (sel === d ? 'border-ink bg-ink text-white' : d === 2 ? 'border-sea bg-sea50' : 'border-slate-200 bg-white hover:border-sea')}>
            <span className="font-bold">{d}</span>
            {events[d] && <span className="w-2 h-2 rounded-full bg-sun mt-1" />}
          </button>
        ))}
      </div>
      <div className="mt-5 rounded-xl bg-mist p-4">
        <p className="font-bold">November {sel}</p>
        {(events[sel] || []).length ? <ul className="list-disc ml-6 mt-2 text-lg">{events[sel].map((e, i) => <li key={i}>{e}</li>)}</ul>
          : <p className="text-slate-600 mt-1">Nothing planned.</p>}
        <AddRow ph="Add an event" onAdd={e => setEvents({ ...events, [sel]: [...(events[sel] || []), e] })} />
      </div>
    </Card>
  );
}
function Goals({ s }) {
  const { goals, setGoals } = s;
  const step = (gid, i) => setGoals(goals.map(g => g.id === gid ? { ...g, steps: g.steps.map((x, j) => j === i ? { ...x, d: !x.d } : x) } : g));
  return (
    <div className="space-y-4">
      {goals.map(g => {
        const n = g.steps.filter(x => x.d).length, p = Math.round(n / g.steps.length * 100);
        return (
          <Card key={g.id}>
            <h2 className="text-xl font-bold">{g.t}</h2>
            <p className="text-slate-600 mb-3">{n} of {g.steps.length} steps</p>
            <Bar v={p} color="bg-sun" />
            <div className="space-y-2 mt-4">
              {g.steps.map((x, i) => <Check key={i} done={x.d} onClick={() => step(g.id, i)}>{x.t}</Check>)}
            </div>
          </Card>
        );
      })}
      <Card><H>New goal</H>
        <AddRow ph="What do you want to get better at?" onAdd={t => setGoals([...goals, { id: Date.now(), t, steps: [{ t: 'Write your first small step', d: false }] }])} />
      </Card>
    </div>
  );
}
function Student({ s }) {
  const [tab, setTab] = useState('today');
  return (
    <>
      <h1 className="text-3xl font-bold mb-1">Hi, Alex</h1>
      <p className="text-lg text-slate-600 mb-6">Pick one thing and start small.</p>
      <Tabs value={tab} onChange={setTab} items={[['today','Tasks'],['plan','Planner'],['cal','Calendar'],['goals','Goals']]} />
      {tab === 'today' && <Today s={s} />}
      {tab === 'plan' && <Planner s={s} />}
      {tab === 'cal' && <Calendar s={s} />}
      {tab === 'goals' && <Goals s={s} />}
    </>
  );
}

/* ---------- PARENT ---------- */
function Parent({ s }) {
  const [tab, setTab] = useState('prog');
  const done = s.tasks.filter(t => t.d).length;
  const skills = [['Starting tasks', 70], ['Planning ahead', 55], ['Keeping track of time', 60], ['Staying organized', 45]];
  return (
    <>
      <h1 className="text-3xl font-bold mb-1">Alex’s progress</h1>
      <p className="text-lg text-slate-600 mb-6">A clear picture of what’s working and what’s next.</p>
      <Tabs value={tab} onChange={setTab} items={[['prog','Progress'],['logs','Session logs']]} />
      {tab === 'prog' ? (
        <div className="space-y-4">
          <Card>
            <H sub="Based on coaching check-ins">Skill growth</H>
            <div className="space-y-4">
              {skills.map(([n, v]) => (
                <div key={n}><div className="flex justify-between mb-1 font-bold"><span>{n}</span><span>{v}%</span></div><Bar v={v} /></div>
              ))}
            </div>
          </Card>
          <Card>
            <H sub={done + ' of ' + s.tasks.length + ' of today’s tasks finished'}>This week</H>
            <div className="flex gap-3">
              {[['Mon', done > 0], ['Tue', true], ['Wed', true], ['Thu', false], ['Fri', false]].map(([d, on]) => (
                <div key={d} className={'flex-1 rounded-xl p-3 text-center font-bold ' + (on ? 'bg-leaf50 text-leaf' : 'bg-slate-100 text-slate-500')}>{d}<div className="text-2xl">{on ? '✓' : '–'}</div></div>
              ))}
            </div>
          </Card>
          <Card>
            <H>Goals in progress</H>
            {s.goals.map(g => <p key={g.id} className="py-2 border-b border-slate-100 last:border-0">{g.t} <span className="text-slate-500">· {g.steps.filter(x => x.d).length}/{g.steps.length} steps</span></p>)}
          </Card>
        </div>
      ) : (
        <div className="space-y-4">
          {s.sessions.map(x => (
            <Card key={x.id}>
              <h2 className="text-xl font-bold mb-2">Session on {x.date}</h2>
              <p className="font-bold text-leaf">Wins</p>
              <ul className="list-disc ml-6 mb-3 text-lg">{x.wins.map((w, i) => <li key={i}>{w}</li>)}</ul>
              <p className="font-bold text-sea">Focus for next time</p>
              <p className="text-lg">{x.focus}</p>
            </Card>
          ))}
        </div>
      )}
    </>
  );
}

/* ---------- COACH ---------- */
function Coach({ s }) {
  const { sessions, setSessions } = s;
  const [wins, setWins] = useState(['Started homework without reminders on 2 days', 'Used a visual timer for reading']);
  const [focus, setFocus] = useState('Break the science project into three steps');
  const [sentId, setSentId] = useState(null);
  const send = () => {
    const rec = { id: sentId || Date.now(), date: 'Nov 2', wins, focus };
    setSessions(sentId ? sessions.map(x => x.id === sentId ? rec : x) : [rec, ...sessions]);
    setSentId(rec.id);
  };
  return (
    <>
      <h1 className="text-3xl font-bold mb-1">Session with Alex</h1>
      <p className="text-lg text-slate-600 mb-6">Monday, November 2 · 4:00 PM</p>
      <div className="grid lg:grid-cols-2 gap-4">
        <div className="space-y-4">
          <Card>
            <H sub="What went well today?">Wins for this session</H>
            <ul className="space-y-2">
              {wins.map((w, i) => (
                <li key={i} className="flex items-start gap-3 bg-leaf50 rounded-xl p-3">
                  <span className="flex-1 text-lg">{w}</span>
                  <button aria-label={'Remove ' + w} onClick={() => setWins(wins.filter((_, j) => j !== i))} className="font-bold px-2 text-slate-500 hover:text-coral">✕</button>
                </li>
              ))}
            </ul>
            <AddRow ph="Add a win" onAdd={w => { setWins([...wins, w]); setSentId(sentId); }} />
          </Card>
          <Card>
            <H sub="One clear priority works best.">Focus for next time</H>
            <textarea aria-label="Focus for next time" value={focus} onChange={e => setFocus(e.target.value)} rows="3"
              className="w-full rounded-xl border-2 border-slate-300 p-3 text-lg" />
          </Card>
        </div>
        <Card>
          <H sub="Preview of what the parent will see">Parent report</H>
          <div className="rounded-xl bg-mist p-4 text-lg space-y-3">
            <p>Hi! Here’s a quick update from today’s session with Alex.</p>
            <div><p className="font-bold text-leaf">Wins</p>
              {wins.length ? <ul className="list-disc ml-6">{wins.map((w, i) => <li key={i}>{w}</li>)}</ul> : <p className="text-slate-500">No wins added yet.</p>}</div>
            <div><p className="font-bold text-sea">Focus for next time</p><p>{focus || 'Not set yet.'}</p></div>
          </div>
          <Btn className="mt-4 w-full" onClick={send}>{sentId ? 'Update report' : 'Send to parent'}</Btn>
          {sentId && <p role="status" className="mt-3 rounded-xl bg-leaf50 p-3 font-bold text-leaf">Sent. It now shows in the Parent view under Session logs.</p>}
        </Card>
      </div>
    </>
  );
}

/* ---------- APP ---------- */
function App() {
  const [role, setRole] = useState('student');
  const [tasks, setTasks] = useState([
    { id: 1, t: 'Math worksheet 4.2', s: 'Math', d: false }, { id: 2, t: 'Read chapter 5 (20 min)', s: 'English', d: true },
    { id: 3, t: 'Pack backpack for tomorrow', s: 'Routine', d: false }, { id: 4, t: 'Email Mr. Ruiz about the science project', s: 'Science', d: false }]);
  const [blocks, setBlocks] = useState([
    { id: 1, time: '3:30 PM', t: 'Snack and reset', d: true }, { id: 2, time: '4:00 PM', t: 'Coaching session', d: false },
    { id: 3, time: '5:00 PM', t: 'Math worksheet', d: false }, { id: 4, time: '5:45 PM', t: 'Break: move your body', d: false },
    { id: 5, time: '6:00 PM', t: 'Reading', d: false }]);
  const [events, setEvents] = useState({ 2: ['Coaching session, 4:00 PM'], 5: ['Science project due'], 9: ['Coaching session, 4:00 PM'], 12: ['Fractions quiz'], 16: ['Coaching session, 4:00 PM'], 20: ['Book report draft due'], 23: ['Coaching session, 4:00 PM'] });
  const [goals, setGoals] = useState([
    { id: 1, t: 'Start homework within 10 minutes of getting home', steps: [{ t: 'Set a 3:30 alarm', d: true }, { t: 'Put backpack by the desk', d: true }, { t: 'Open the first assignment', d: false }] },
    { id: 2, t: 'Check my planner every day', steps: [{ t: 'Look at it after breakfast', d: true }, { t: 'Cross off finished tasks', d: false }, { t: 'Plan tomorrow before bed', d: false }] }]);
  const [sessions, setSessions] = useState([
    { id: 101, date: 'Oct 26', wins: ['Used a timer for the full homework block', 'Asked a teacher for help'], focus: 'Write down due dates right when they’re given' },
    { id: 102, date: 'Oct 19', wins: ['Packed backpack the night before 3 times'], focus: 'Build a short after-school routine' }]);
  const s = { tasks, setTasks, blocks, setBlocks, events, setEvents, goals, setGoals, sessions, setSessions };
  return (
    <div className="min-h-screen">
      <header className="bg-white border-b border-slate-200">
        <div className="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
          <div className="flex items-center gap-3">
            <span className="w-10 h-10 rounded-xl bg-sea text-white grid place-items-center font-bold text-xl">S</span>
            <span className="text-xl font-bold">Steady Steps</span>
          </div>
          <nav aria-label="Switch view" className="flex gap-1 bg-mist rounded-xl p-1">
            {[['student', 'Student'], ['parent', 'Parent'], ['coach', 'Coach']].map(([k, l]) => (
              <button key={k} onClick={() => setRole(k)} aria-pressed={role === k}
                className={'px-4 py-2 rounded-lg font-bold transition-colors ' + (role === k ? 'bg-white shadow text-sea' : 'text-slate-600 hover:text-ink')}>{l}</button>
            ))}
          </nav>
        </div>
      </header>
      <main className="max-w-5xl mx-auto px-4 py-8">
        {role === 'student' && <Student s={s} />}
        {role === 'parent' && <Parent s={s} />}
        {role === 'coach' && <Coach s={s} />}
        <p className="text-center text-slate-500 mt-10">Demo with sample data. Changes reset when you refresh.</p>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

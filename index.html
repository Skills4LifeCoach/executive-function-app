<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills 4Life Coaching Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:'#3B62FF',royal:'#2F54EB',slate4:'#707070'},fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']}}}}</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>body{background:#F4F6FB;color:#1f2433}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #3B62FF;outline-offset:2px}</style>
</head>
<body class="font-sans">
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo}=React;
const L=window.lucideReact||window.LucideReact||{};
const I=(n)=>L[n]||(()=>null);
const [CheckCircle2,Circle,Plus,Target,CalendarDays,ListChecks,Users,GraduationCap,ClipboardList,Download,Eye,EyeOff,Trophy,Send,Sparkles,Clock,LogOut,AlertCircle]=
 ['CheckCircle2','Circle','Plus','Target','CalendarDays','ListChecks','Users','GraduationCap','ClipboardList','Download','Eye','EyeOff','Trophy','Send','Sparkles','Clock','LogOut','AlertCircle'].map(I);

/* Mock user directory: stands in for a database lookup by email. */
const USER_DIRECTORY={
 'student@skills4life.com':{role:'student',name:'Student'},
 'parent@skills4life.com':{role:'parent',name:'Parent'},
 'coach@skills4life.com':{role:'coach',name:'Coach'}
};
const lookupUser=(email)=>USER_DIRECTORY[email.trim().toLowerCase()]||null;

const Logo=({size=48})=>(
<svg width={size} height={size} viewBox="0 0 64 64" role="img" aria-label="Skills 4Life Coaching logo">
 <circle cx="32" cy="32" r="30.5" fill="#fff" stroke="#707070" strokeWidth="1.6"/>
 <circle cx="32" cy="32" r="26.5" fill="none" stroke="#3B62FF" strokeWidth="1.2"/>
 <g stroke="#3B62FF" strokeWidth="1.8" strokeLinecap="round">
  <line x1="32" y1="8" x2="32" y2="12"/><line x1="19" y1="12" x2="21.5" y2="15.5"/><line x1="45" y1="12" x2="42.5" y2="15.5"/>
  <line x1="12" y1="22" x2="16" y2="23.5"/><line x1="52" y1="22" x2="48" y2="23.5"/>
 </g>
 <path d="M32 17c-3-3-9-2.5-11 1.5-3 .5-5 3.5-4 6.5-1.5 3 .5 6.500 3.500 7 .5 2 2.500 3.500 4.500 3.500h14c2 0 4-1.500 4.500-3.500 3-.5 5-4 3.500-7 1-3-1-6-4-6.500-2-4-8-4.500-11-1.500z" fill="#707070"/>
 <path d="M26 22c2 1 3 3 2 5m8-5c-2 1-3 3-2 5m-7 4c2 0 3 1 4 2m6-2c-2 0-3 1-4 2" stroke="#fff" strokeWidth="1.2" fill="none" strokeLinecap="round"/>
 <path d="M26 35h12v4c0 2-2 3-3 4v1.500h-6V43c-1-1-3-2-3-4z" fill="#707070"/>
 <rect x="27.500" y="46" width="9" height="2" rx="1" fill="#3B62FF"/><rect x="29" y="49.500" width="6" height="1.800" rx=".9" fill="#3B62FF"/>
</svg>);

const Card=({title,icon:Ic,children,action})=>(
<section className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
 <div className="flex items-center justify-between mb-4"><h3 className="flex items-center gap-2 font-bold text-slate-800">{Ic&&<Ic size={18} className="text-brand"/>}{title}</h3>{action}</div>
 {children}
</section>);

const initTasks=[{id:1,t:'Finish science lab write-up',due:'Tue',done:false},{id:2,t:'Pack backpack the night before',due:'Daily',done:true},{id:3,t:'Break history project into 3 steps',due:'Thu',done:false},{id:4,t:'10-minute reading with notes',due:'Daily',done:false}];
const initGoals=[{id:1,g:'Start homework within 15 minutes of arriving home',p:60},{id:2,g:'Use planner for every assignment',p:80},{id:3,g:'Ask for help before a deadline stress spike',p:35}];
const planner=[['Mon','Math practice set','4:00'],['Tue','Science lab write-up','4:30'],['Wed','Reading + notes','4:00'],['Thu','History project step 2','4:30'],['Fri','Weekly planner reset','3:45']];

/* Calendar data for November 2026. kind: session | task | goal | log */
const events={
 2:[{k:'log',t:'Session logged',n:'Started homework on time 3 days in a row. Used the planner without a reminder.'}],
 3:[{k:'session',t:'Coaching session',n:'4:00 pm. Review the weekly planner and the homework-start timer.'},{k:'task',t:'Break history project into 3 steps',n:'Bring your three steps to the session.'}],
 5:[{k:'task',t:'Science lab write-up due',n:'Turn in before class.'}],
 7:[{k:'goal',t:'Goal check-in: Use planner for every assignment',n:'Currently at 80%. Aim for every assignment this week.'},{k:'task',t:'Weekly planner reset',n:'15 minutes: clear last week, add next week.'}],
 10:[{k:'session',t:'Coaching session',n:'4:00 pm. Check progress on the history project.'}],
 12:[{k:'task',t:'History project step 2',n:'Draft the outline.'}],
 17:[{k:'session',t:'Coaching session',n:'4:00 pm. Goal review.'}],
 19:[{k:'task',t:'Quiz',n:'Study for 10 minutes each night this week.'}],
 24:[{k:'session',t:'Coaching session',n:'4:00 pm. Plan the project wrap-up.'}],
 26:[{k:'task',t:'History project due',n:'Final check: all three steps done.'}]
};
const kindMeta={session:{label:'Session',Ic:Users},task:{label:'Task',Ic:ListChecks},goal:{label:'Goal',Ic:Target},log:{label:'Session log',Ic:ClipboardList}};
const TODAY=2;

function Login({onLogin}){
 const [email,setEmail]=useState('');
 const [password,setPassword]=useState('');
 const [error,setError]=useState('');
 const submit=(e)=>{
  e.preventDefault();
  const user=lookupUser(email);
  if(!user){setError('Account not recognized. Please contact your Skills 4Life Coach to set up your private access.');return}
  setError('');onLogin(user);
 };
 return(<div className="max-w-md mx-auto mt-6">
 <section className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
  <div className="flex flex-col items-center text-center mb-6">
   <Logo size={64}/>
   <h1 className="text-2xl font-extrabold text-slate-800 mt-3">Sign in</h1>
   <p className="text-slate4 text-sm mt-1">Use the email address your coach set up for you.</p>
  </div>
  <form onSubmit={submit} noValidate className="space-y-4">
   <label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">Email</span>
    <input type="email" autoComplete="username" value={email} onChange={e=>{setEmail(e.target.value);setError('')}} placeholder="you@example.com" aria-invalid={!!error} aria-describedby={error?'login-error':undefined} className="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand"/></label>
   <label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">Password</span>
    <input type="password" autoComplete="current-password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Enter your password" className="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand"/></label>
   {error&&<div id="login-error" role="alert" className="flex gap-2 items-start bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 text-sm"><AlertCircle size={18} className="shrink-0 mt-0.5"/><p>{error}</p></div>}
   <button type="submit" className="w-full bg-brand text-white font-semibold rounded-xl px-4 py-2.5 hover:bg-royal transition">Sign in</button>
  </form>
  <div className="mt-5 pt-4 border-t border-slate-100 text-xs text-slate4">
   <p className="font-semibold mb-1">Prototype test accounts (any password works):</p>
   <ul className="space-y-0.5">
    <li>Student: <span className="font-mono text-slate-700">student@skills4life.com</span></li>
    <li>Parent: <span className="font-mono text-slate-700">parent@skills4life.com</span></li>
    <li>Coach: <span className="font-mono text-slate-700">coach@skills4life.com</span></li>
   </ul>
  </div>
 </section></div>);
}

function CalendarSection(){
 const [selectedDate,setSelectedDate]=useState(TODAY);
 const items=events[selectedDate]||[];
 const label=new Date(2026,10,selectedDate).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
 return(<div className="lg:col-span-2 grid md:grid-cols-2 gap-5">
 <Card title="November 2026" icon={CalendarDays}>
  <div className="grid grid-cols-7 gap-1 text-center text-xs text-slate4 mb-1">{['S','M','T','W','T','F','S'].map((d,i)=><div key={i}>{d}</div>)}</div>
  <div className="grid grid-cols-7 gap-1">{Array.from({length:30},(_,i)=>i+1).map(d=>{
   const sel=d===selectedDate,has=!!events[d];
   return(<button key={d} type="button" onClick={()=>setSelectedDate(d)} aria-pressed={sel}
    aria-label={new Date(2026,10,d).toLocaleDateString('en-US',{month:'long',day:'numeric'})+(has?', has items':'')+(d===TODAY?', today':'')}
    className={'aspect-square rounded-full flex flex-col items-center justify-center text-sm transition cursor-pointer '+
     (sel?'bg-royal text-white font-bold shadow-md ring-2 ring-royal ring-offset-2':(has?'bg-brand/10 text-brand font-bold hover:bg-brand/20':'text-slate-600 hover:bg-slate-100'))+
     (!sel&&d===TODAY?' ring-2 ring-brand':'')}>
    {d}{has&&<span className={'w-1.5 h-1.5 rounded-full mt-0.5 '+(sel?'bg-white':'bg-brand')}/>}
   </button>);})}</div>
  <p className="text-xs text-slate4 mt-3">Click a day to see what is scheduled. Dots mark days with items. Today has a thin outline.</p>
 </Card>
 <Card title="Schedule & Tasks for Selected Date" icon={ListChecks}>
  <div aria-live="polite">
   <p className="font-bold text-royal mb-3">{label}{selectedDate===TODAY&&<span className="ml-2 text-xs font-semibold text-slate4">Today</span>}</p>
   {items.length===0
    ?<div className="text-center py-10 text-slate4"><CalendarDays className="mx-auto mb-2" size={28}/><p>No sessions or tasks scheduled for this day.</p></div>
    :<ul className="space-y-3">{items.map((it,i)=>{const M=kindMeta[it.k];return(
      <li key={i} className="flex gap-3 p-3 rounded-xl border border-slate-200 bg-slate-50">
       <M.Ic size={20} className="text-brand mt-0.5 shrink-0"/>
       <div><p className="text-xs font-semibold text-slate4">{M.label}</p><p className="font-semibold text-slate-800">{it.t}</p><p className="text-sm text-slate-600">{it.n}</p></div>
      </li>);})}</ul>}
  </div>
 </Card></div>);
}

function Student(){
 const [tasks,setTasks]=useState(initTasks);const [nt,setNt]=useState('');const [goals,setGoals]=useState(initGoals);
 const add=()=>{if(!nt.trim())return;setTasks([...tasks,{id:Date.now(),t:nt.trim(),due:'This week',done:false}]);setNt('')};
 const done=tasks.filter(t=>t.done).length;
 return(<div className="grid lg:grid-cols-2 gap-5">
 <Card title="My Task List" icon={ListChecks} action={<span className="text-sm text-slate4">{done}/{tasks.length} done</span>}>
  <ul className="space-y-2">{tasks.map(t=>(<li key={t.id}><button onClick={()=>setTasks(tasks.map(x=>x.id===t.id?{...x,done:!x.done}:x))} className="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50 text-left">
   {t.done?<CheckCircle2 className="text-brand" size={22}/>:<Circle className="text-slate-400" size={22}/>}
   <span className={'flex-1 '+(t.done?'line-through text-slate-400':'text-slate-800')}>{t.t}</span><span className="text-xs text-slate4">{t.due}</span></button></li>))}</ul>
  <div className="flex gap-2 mt-4"><input value={nt} onChange={e=>setNt(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="Add a task" className="flex-1 border border-slate-300 rounded-xl px-3 py-2"/><button onClick={add} className="bg-brand text-white rounded-xl px-4 flex items-center gap-1 font-semibold"><Plus size={16}/>Add</button></div>
 </Card>
 <Card title="Goals" icon={Target}>
  <div className="space-y-4">{goals.map(g=>(<div key={g.id}><div className="flex justify-between text-sm mb-1"><span className="font-medium text-slate-700">{g.g}</span><span className="text-brand font-bold">{g.p}%</span></div>
   <div className="h-2.5 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-brand rounded-full transition-all" style={{width:g.p+'%'}}/></div>
   <input type="range" min="0" max="100" value={g.p} aria-label="Goal progress" onChange={e=>setGoals(goals.map(x=>x.id===g.id?{...x,p:+e.target.value}:x))} className="w-full mt-2 accent-brand"/></div>))}</div>
 </Card>
 <Card title="Weekly Planner" icon={ClipboardList}>
  <div className="divide-y divide-slate-100">{planner.map(([d,t,tm])=>(<div key={d} className="flex items-center gap-4 py-2.5"><span className="w-12 font-bold text-brand">{d}</span><span className="flex-1 text-slate-700">{t}</span><span className="flex items-center gap-1 text-xs text-slate4"><Clock size={13}/>{tm} pm</span></div>))}</div>
 </Card>
 <CalendarSection/></div>);
}

function Parent({report,wins}){
 const dl=()=>{const txt=`SKILLS 4LIFE COACHING - PARENT REPORT\n=====================================\nSession date: ${report.date}\n\nWins this session:\n${report.wins}\n\nFocus for next time:\n${report.focus}\n\nNotes for parents:\n${report.note||'None'}\n`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='parent-report.txt';a.click()};
 return(<div className="grid lg:grid-cols-2 gap-5">
 <Card title="Latest Session Update" icon={Users} action={report.visible&&<button onClick={dl} className="flex items-center gap-1.5 bg-brand text-white text-sm font-semibold rounded-xl px-3 py-1.5"><Download size={15}/>Download report</button>}>
  {report.visible?(<div className="space-y-4 text-slate-700"><p className="text-xs text-slate4">Session on {report.date}</p>
   <div><h4 className="font-bold text-slate-800 mb-1">Wins</h4><p className="whitespace-pre-wrap">{report.wins||'Nothing logged yet.'}</p></div>
   <div><h4 className="font-bold text-slate-800 mb-1">Focus for next time</h4><p className="whitespace-pre-wrap">{report.focus||'Nothing logged yet.'}</p></div>
   {report.note&&<div className="bg-brand/5 rounded-xl p-3"><h4 className="font-bold text-slate-800 mb-1">Note from your coach</h4><p className="whitespace-pre-wrap">{report.note}</p></div>}</div>)
  :(<div className="text-center py-10 text-slate4"><EyeOff className="mx-auto mb-2" size={28}/><p>Your coach hasn’t shared this report yet. Check back after the next session.</p></div>)}
 </Card>
 <Card title="Wins Tracker" icon={Trophy}>
  <ul className="space-y-3">{wins.map((w,i)=>(<li key={i} className="flex gap-3"><Sparkles size={18} className="text-brand mt-0.5 shrink-0"/><div><p className="text-slate-800">{w.t}</p><p className="text-xs text-slate4">{w.d}</p></div></li>))}</ul>
 </Card>
 <Card title="Session Log" icon={ClipboardList}>
  <div className="divide-y divide-slate-100">{[['Oct 27','Built a Sunday planner routine'],['Oct 20','Practiced breaking big projects into steps'],['Oct 13','Set up a homework-start timer']].map(([d,t])=>(<div key={d} className="flex gap-4 py-2.5"><span className="w-16 font-bold text-brand">{d}</span><span className="text-slate-700">{t}</span></div>))}</div>
 </Card></div>);
}

function Coach({report,setReport,addWin}){
 const [saved,setSaved]=useState(false);
 const set=(k,v)=>{setReport({...report,[k]:v});setSaved(false)};
 const Field=({label,k,ph,rows=4})=>(<label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">{label}</span>
  <textarea rows={rows} value={report[k]} onChange={e=>set(k,e.target.value)} placeholder={ph} className="w-full border border-slate-300 rounded-xl px-3 py-2 focus:border-brand"/></label>);
 return(<div className="grid lg:grid-cols-3 gap-5">
 <div className="lg:col-span-2"><Card title="Session Notes" icon={ClipboardList}><div className="space-y-4">
  <label className="block"><span className="block text-sm font-semibold text-slate-700 mb-1">Session date</span><input value={report.date} onChange={e=>set('date',e.target.value)} className="border border-slate-300 rounded-xl px-3 py-2"/></label>
  <Field label="Wins this session" k="wins" ph="What went well? One win per line."/>
  <Field label="Focus for next time" k="focus" ph="What will we work on next?"/>
  <Field label="Note for parents (optional)" k="note" rows={3} ph="Anything parents can support at home?"/>
  <div className="flex flex-wrap gap-3"><button onClick={()=>{addWin();setSaved(true)}} className="flex items-center gap-2 bg-brand text-white font-semibold rounded-xl px-4 py-2"><Send size={16}/>Save to wins tracker</button>{saved&&<span className="self-center text-sm text-brand font-medium">Saved to the parent wins tracker.</span>}</div>
 </div></Card></div>
 <Card title="Parent Report Visibility" icon={report.visible?Eye:EyeOff}>
  <p className="text-sm text-slate-600 mb-4">Parents see the report only when sharing is on.</p>
  <button role="switch" aria-checked={report.visible} onClick={()=>set('visible',!report.visible)} className="flex items-center gap-3">
   <span className={'w-12 h-7 rounded-full p-1 transition '+(report.visible?'bg-brand':'bg-slate-300')}><span className={'block w-5 h-5 bg-white rounded-full transition '+(report.visible?'translate-x-5':'')}/></span>
   <span className="font-semibold text-slate-800">{report.visible?'Shared with parents':'Hidden from parents'}</span></button>
 </Card></div>);
}

function App(){
 /* The role comes only from the email lookup at sign-in; it cannot be changed from the UI afterward. */
 const [user,setUser]=useState(null);
 const role=user?user.role:null;
 const [report,setReport]=useState({date:'Nov 2, 2026',wins:'Started homework on time 3 days in a row.\nUsed the planner without a reminder.',focus:'Breaking the history project into smaller steps.',note:'',visible:true});
 const [wins,setWins]=useState([{t:'Turned in every assignment on time',d:'Oct 27'},{t:'Asked a teacher for help before the due date',d:'Oct 20'}]);
 const addWin=()=>{const n=report.wins.split('\n').map(s=>s.trim()).filter(Boolean).filter(s=>!wins.some(w=>w.t===s)).map(t=>({t,d:report.date}));setWins([...n,...wins])};
 return(<div className="min-h-screen">
  <header className="bg-white border-b border-slate-200 sticky top-0 z-10">
   <div className="max-w-6xl mx-auto px-5 py-3 flex flex-wrap items-center justify-between gap-3">
    <div className="flex items-center gap-3"><Logo/><div className="leading-tight"><div className="text-xl font-extrabold text-brand tracking-tight">Skills 4Life</div><div className="text-xs font-semibold text-slate4 tracking-[0.25em]">COACHING</div></div></div>
    {user&&<button onClick={()=>setUser(null)} className="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 text-slate4 hover:text-slate-900 transition"><LogOut size={16}/>Sign out</button>}
   </div></header>
  <main className="max-w-6xl mx-auto px-5 py-8">
   {!user&&<Login onLogin={setUser}/>}
   {user&&<>
    <h1 className="text-2xl font-extrabold text-slate-800 mb-1">{role==='student'?'Student Dashboard':role==='parent'?'Parent Portal':'Coach Dashboard'}</h1>
    <p className="text-slate4 mb-6">{role==='student'?'Your tasks, plans, and goals for this week.':role==='parent'?'Progress, session updates, and wins.':'Log the session and choose what parents can see.'}</p>
    {role==='student'&&<Student/>}{role==='parent'&&<Parent report={report} wins={wins}/>}{role==='coach'&&<Coach report={report} setReport={setReport} addWin={addWin}/>}
   </>}
  </main>
  <footer className="text-center text-xs text-slate4 pb-8">Skills 4Life Coaching · Executive function skills for life</footer>
 </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
